<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1D1520">
<title>Книга рецептов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1D1520;
    --surface: #2A2030;
    --surface-2: #362A3D;
    --text: #F5EDE4;
    --muted: #B4A3B3;
    --accent: #F2B33D;
    --accent-ink: #2A1A05;
    --danger: #F0857A;
    --line: rgba(245, 237, 228, 0.12);
    --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --safe-bottom: calc(var(--tg-safe-area-inset-bottom, 0px) + env(safe-area-inset-bottom, 0px));
    --r-lg: 22px;
    --r-md: 14px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.5 'Rubik', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  [dir="rtl"] .flip { transform: scaleX(-1); }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + 96px);
  }
  .app.hero-view { padding-top: 0; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    border: 0; background: var(--surface); border-radius: 999px; padding: 9px 16px 9px 12px; font-weight: 500;
  }
  .home-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  h1 { font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  h2 { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
  .sub { margin: 4px 0 0; color: var(--muted); }
  .langs { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; flex: none; }
  .lang { border: 0; background: transparent; border-radius: 999px; padding: 5px 10px; font-size: 13px; color: var(--muted); }
  .lang.on { background: var(--surface-2); color: var(--text); }

  /* Import */
  .import { background: var(--surface); border-radius: var(--r-lg); padding: 16px; margin-bottom: 18px; }
  .import h2 { margin-bottom: 10px; }
  .import textarea {
    width: 100%; min-height: 52px; max-height: 180px; resize: vertical;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; line-height: 1.4;
  }
  .import textarea::placeholder, .field::placeholder, .search input::placeholder { color: var(--muted); opacity: 0.8; }
  .import-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 14px; margin: 0; }
  .link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  .progress { display: flex; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 600; min-height: 46px;
  }
  .btn[disabled] { opacity: 0.5; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-soft { background: var(--surface-2); color: var(--text); }
  .btn-ghost { background: transparent; color: var(--muted); }
  .btn-danger { background: transparent; color: var(--danger); }
  .btn-round { width: 44px; min-height: 44px; padding: 0; }
  .fab {
    position: fixed; inset-inline-end: max(16px, calc(50vw - 304px)); bottom: calc(var(--safe-bottom) + 20px);
    width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); z-index: 5;
  }
  .fab .icon { width: 26px; height: 26px; stroke-width: 2.4; }

  /* Search and chips */
  .search { position: relative; margin-bottom: 14px; }
  .search .icon { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input {
    width: 100%; border: 0; background: var(--surface); border-radius: 999px; padding: 13px 16px 13px 44px;
  }
  [dir="rtl"] .search input { padding: 13px 44px 13px 16px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 22px; padding: 2px 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; flex: none; white-space: nowrap;
    border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 14px; font-weight: 500;
  }
  .chip .count { color: var(--muted); font-weight: 400; }
  .chip.add { border-style: dashed; color: var(--muted); }

  /* Recipe tiles */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile {
    position: relative; display: block; aspect-ratio: 4 / 5; border: 0; padding: 0; overflow: hidden;
    border-radius: var(--r-lg); background: var(--surface); text-align: start;
  }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile .no-photo { position: absolute; inset: 0; display: grid; place-items: center; font-size: 54px; background: color-mix(in srgb, var(--c, #888) 22%, var(--surface)); }
  .tile .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(20, 12, 22, 0.92) 0%, rgba(20, 12, 22, 0.15) 55%, transparent 75%); }
  .tile .t-text { position: absolute; inset-inline: 12px; bottom: 12px; }
  .tile .t-title { display: block; font-weight: 600; font-size: 16px; line-height: 1.2; color: #fff; }
  .tile .t-meta { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 13px; color: rgba(255, 255, 255, 0.75); }
  .tile .t-meta .icon { width: 14px; height: 14px; }
  .tile .t-star { position: absolute; top: 10px; inset-inline-end: 10px; color: var(--accent); }
  .tile .t-star .icon { fill: currentColor; width: 18px; height: 18px; }
  .empty { color: var(--muted); padding: 24px 0; margin: 0; }

  /* Recipe page */
  .hero { position: relative; margin: 0 -16px; min-height: 300px; height: 58vh; max-height: 520px; overflow: hidden; background: var(--surface); }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero .no-photo { position: absolute; inset: 0; display: grid; place-items: center; font-size: 96px; background: color-mix(in srgb, var(--c, #888) 25%, var(--surface)); }
  .hero .shade { position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 2%, rgba(29, 21, 32, 0.55) 40%, transparent 70%); }
  .hero .back { position: absolute; top: calc(var(--safe-top) + 14px); inset-inline-start: 16px; background: rgba(29, 21, 32, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .hero-text { position: absolute; inset-inline: 16px; bottom: 18px; }
  .recipe-title { font-size: 40px; line-height: 1.02; font-weight: 800; letter-spacing: -0.025em; margin: 10px 0 0; text-wrap: balance; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; font-size: 14px; background: rgba(29, 21, 32, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .tag.ai { color: var(--accent); }
  .tag .icon { width: 16px; height: 16px; }
  .facts { display: flex; flex-wrap: wrap; gap: 18px; margin: 18px 0 16px; color: var(--muted); }
  .fact { display: inline-flex; align-items: center; gap: 7px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .tool { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 500; }
  .tool.on { color: var(--accent); }
  .tool.on .icon-star { fill: currentColor; }
  .translate { display: flex; gap: 8px; margin: -14px 0 28px; flex-wrap: wrap; align-items: center; }
  .translate input { flex: 1 1 160px; min-width: 0; border: 0; background: var(--surface); border-radius: 999px; padding: 11px 16px; }

  .section { margin-bottom: 30px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .section-head h2 { margin: 0; }
  .servings { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 999px; padding: 3px; }
  .servings .btn-round { background: transparent; min-height: 38px; width: 38px; }
  .serv-val { min-width: 84px; text-align: center; font-weight: 500; }
  .ingr { list-style: none; margin: 0; padding: 0; }
  .ingr li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ingr b { font-weight: 500; color: var(--accent); white-space: nowrap; }
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  .step { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .step-num { font-size: 30px; line-height: 1; font-weight: 800; color: var(--accent); }
  .step.done .step-num { color: var(--muted); }
  .step.done .step-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .step-num .icon { width: 28px; height: 28px; stroke-width: 2.4; }
  .end-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }

  /* Forms */
  .head { margin-bottom: 18px; }
  .form { display: grid; gap: 16px; }
  .form label, .field-title { display: grid; gap: 6px; color: var(--muted); font-size: 14px; margin: 0; }
  .form input, .form select, .form textarea {
    width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 12px 14px; color: var(--text);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ingr-set { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
  .ingr-set legend { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .ing-row { display: grid; grid-template-columns: 1fr 72px 64px 36px; gap: 6px; }
  .btn-remove { border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
  .photo-box { display: grid; gap: 10px; }
  .photo-preview { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--r-md); }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .emoji { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-size: 22px; aspect-ratio: 1; }
  .emoji.on { border-color: var(--accent); background: var(--surface-2); }
  .actions { display: grid; gap: 10px; margin-top: 8px; }
  .error { color: var(--danger); margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 3s; }
  }
</style>
</head>
<body>
<main class="app" id="app"></main>

  function pickUiLang(saved, tgCode) {
    const code = saved || String(tgCode || '').slice(0, 2);
    return I18N[code] ? code : (code ? 'en' : 'ru');
  }
  let uiLang = pickUiLang(readJSON(UI_LANG_KEY, ''), tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code);
  const t = key => I18N[uiLang][key];

  // Seed recipes are offered once: new ones reach existing users, deleted ones stay deleted
  function missingSeeds(list, offered) {
    const add = SEED.filter(s => !offered.includes(s.title) && !list.some(r => r.title === s.title));
    return { add, offered: SEED.map(s => s.title) };
  }

  function loadRecipes() {
    const saved = readJSON(KEY, []);
    const list = Array.isArray(saved) ? saved : [];
    const { add, offered } = missingSeeds(list, readJSON(OFFERED_KEY, []));
    const next = [...list, ...add.map(r => ({ ...r, id: uid() }))];
    if (add.length) writeJSON(KEY, next);
    writeJSON(OFFERED_KEY, offered);
    return next;
  }

  // Bot recipes are imported once, like seeds: a recipe deleted in the app stays deleted
  function newFromServer(server, imported) {
    return { add: server.filter(s => !imported.includes(s.id)), imported: server.map(s => s.id) };
  }

  // Matches a category by stored name or by its label in any interface language
  function findCategory(name, cats) {
    const key = String(name || '').trim().toLowerCase();
    if (!key) return null;
    return cats.find(c => c.name !== OLD_BOT_CAT && (c.name.toLowerCase() === key ||
      Object.values(I18N).some(d => (d.cats[c.name] || '').toLowerCase() === key))) || null;
  }

  // Returns the category name to store, creating the category when the model proposed a new one
  function resolveCategory(name, icon) {
    const found = findCategory(name, allCategories());
    if (found) return found.name;
    const clean = String(name || '').trim().slice(0, 30);
    if (!clean) return CATEGORIES[2].name;
    const cat = { name: clean, icon: icon || '🍽️', color: PALETTE[customCats.length % PALETTE.length] };
    customCats = [...customCats, cat];
    writeJSON(CATS_KEY, customCats);
    return cat.name;
  }

  // A recipe the server extracted (bot draft or Mini App import) in the shape the app stores
  function fromServer(s) {
    return {
      title: String(s.title || ''),
      photo: s.photo || '',
      category: resolveCategory(s.category, s.categoryIcon),
      time: Number(s.time) || 0,
      timeEstimated: !!s.timeEstimated,
      baseServings: Number(s.servings) || 4,
      ingredients: (s.ingredients || []).map(i => (typeof i === 'string'
        ? { name: i, amount: '', unit: '' }
        : { name: String(i.name || ''), amount: String(i.amount ?? ''), unit: String(i.unit ?? '') })),
      steps: (s.steps || []).map(String),
      ai: true
    };

  // Recipes saved before auto-categories sat in one "from the bot" category; sort them once
  async function migrateBotCategory() {
    for (const r of recipes.filter(x => x.category === OLD_BOT_CAT)) {
      const text = [r.title, ...r.ingredients.map(i => [i.name, i.amount, i.unit].filter(Boolean).join(' ')), ...r.steps].join('\n');
      try {
        const m = fromServer((await apiPost('/api/import', { input: text.slice(0, 8000), categories: userCategories() })).recipe);
        recipes = recipes.map(x => (x.id === r.id ? {
          ...x, category: m.category, time: x.time || m.time, timeEstimated: x.time ? !!x.timeEstimated : m.timeEstimated,
          baseServings: m.baseServings, ingredients: m.ingredients.length ? m.ingredients : x.ingredients, ai: true
        } : x));
        writeJSON(KEY, recipes);
      } catch (err) {
        console.error('migrate failed', err.message);
      }
    }
    if (!recipes.some(r => r.category === OLD_BOT_CAT) && customCats.some(c => c.name === OLD_BOT_CAT)) {
      customCats = customCats.filter(c => c.name !== OLD_BOT_CAT);
      writeJSON(CATS_KEY, customCats);
    }
    render();
  }

  function syncFromServer() {
    if (!tg || !tg.initData) return;
    fetch(`${API}/api/recipes`, { headers: { 'x-telegram-init-data': tg.initData } })
      .then(res => (res.ok ? res.json() : Promise.reject(new Error(res.status))))
      .then(({ recipes: server }) => {
        const { add, imported } = newFromServer(server, readJSON(IMPORTED_KEY, []));
        if (add.length) {
          recipes = [...add.map(s => ({ ...fromServer(s), id: s.id })), ...recipes];
          if (!writeJSON(KEY, recipes)) return;
        }
        writeJSON(IMPORTED_KEY, imported);
        if (add.length) render();
      })
      .catch(err => console.error('sync failed', err.message))
      .finally(() => {
        if (recipes.some(r => r.category === OLD_BOT_CAT)) migrateBotCategory();
      });
  }

  function scale(amount, factor) {
    const text = String(amount).trim();
    const fraction = text.match(/^(\d+)\s*\/\s*(\d+)$/);
    const n = fraction ? fraction[1] / fraction[2] : parseFloat(text.replace(',', '.'));
    return isNaN(n) ? text : fmtNum(n * factor);
  }

  // Scales the photo down and re-encodes it as JPEG so the data URL stays small
  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, MAX_PHOTO / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * k);
        canvas.height = Math.round(img.height * k);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('bad image'));
      };
      img.src = url;
    });
  }

  // Turns raw form values into a recipe, or { error } with the first problem found
  function parseRecipe(d) {
    const title = d.name.trim();
    const time = d.time.trim();
    const servings = d.servings.trim();
    const ingredients = d.ingredients
      .map(i => ({ name: i.name.trim(), amount: i.amount.trim().replace(',', '.'), unit: i.unit.trim() }))
      .filter(i => i.name);
    const steps = d.steps.split('\n').map(s => s.trim()).filter(Boolean);

    if (!title) return { error: t('errTitle') };
    if (title.length > 80) return { error: t('errTitleLong') };
    if (!allCategories().some(c => c.name === d.category)) return { error: t('errCat') };
    if (time && !/^\d+$/.test(time)) return { error: t('errTime') };
    if (!/^\d+$/.test(servings) || Number(servings) < 1) return { error: t('errServ') };
    if (!ingredients.length) return { error: t('errIngr') };
    if (!steps.length) return { error: t('errSteps') };

    return {
      recipe: {
        title,
        category: d.category,
        time: Number(time) || 0,
        baseServings: Number(servings),
        ingredients,
        steps,
        photo: d.photo
      }
    };
  }

  function parseCategory(c, existing) {
    const name = c.name.trim();
    if (!name) return { error: t('errCatName') };
    if (name.length > 30) return { error: t('errCatLong') };
    if (existing.some(x => x.name.toLowerCase() === name.toLowerCase())) return { error: t('errCatExists') };
    if (!c.icon) return { error: t('errEmoji') };
    return { category: { name, icon: c.icon, color: PALETTE[(existing.length - CATEGORIES.length) % PALETTE.length] } };
  }

  function readCatForm() {
    state.catDraft.name = document.getElementById('c-name').value;
    return state.catDraft;
  }

  function saveRecipe() {
    const parsed = parseRecipe(readForm());
    if (parsed.error) return fail(parsed.error);
    const old = recipes.find(r => r.id === state.editingId) || {};
    const recipe = {
      ...parsed.recipe,
      id: state.editingId || uid(),
      favorite: !!old.favorite,
      ai: !!old.ai,
      timeEstimated: !!old.timeEstimated && parsed.recipe.time === old.time
    };

    const next = state.editingId
      ? recipes.map(r => (r.id === recipe.id ? recipe : r))
      : [recipe, ...recipes];
    if (!writeJSON(KEY, next)) {
      return fail(t('errStorage'));
    }
    recipes = next;

    if (state.editingId) {
      delete done[recipe.id];
      writeJSON(DONE_KEY, done);
      state.history = state.history.slice(0, -1); // drop the recipe screen the edit came from
    }

    go('recipe', { recipeId: recipe.id, servings: recipe.baseServings }, { replace: true });
  }

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;

    switch (el.dataset.action) {
      case 'back':
        goBack();
        break;

      case 'open-cat':
        go('category', { category: el.dataset.cat });
        break;

      case 'open-recipe': {
        const r = recipes.find(x => x.id === el.dataset.id);
        if (r) go('recipe', { recipeId: r.id, servings: r.baseServings, showTranslate: false });
        break;
      }

      case 'new': {
        go('form', {
          draft: blankDraft(state.view === 'category' ? state.category : ''),
          editingId: ''
        });
        break;
      }

      case 'open-favs':
        go('favs');
        break;

      case 'open-bot': {
        const url = `https://t.me/${BOT_USERNAME}`;
        if (tg) tg.openTelegramLink(url);
        else window.open(url, '_blank');
        break;
      }

      case 'translate': {
        const r = recipes.find(x => x.id === state.recipeId);
        const lang = document.getElementById('t-lang').value.trim();
        if (!r || state.translating) break;
        if (!lang) {
          state.translateError = t('errLang');
          render();
          break;
        }
        if (!tg || !tg.initData) {
          state.translateError = t('errOnlyTg');
          render();
          break;
        }
        writeJSON(LANG_KEY, lang);
        Object.assign(state, { translating: true, translateError: '' });
        render();
        const recipe = {
          title: String(r.title),
          ingredients: r.ingredients.map(i => ({ name: String(i.name ?? ''), amount: String(i.amount ?? ''), unit: String(i.unit ?? '') })),
          steps: r.steps.map(String)
        };
        fetch(`${API}/api/translate`, {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-telegram-init-data': tg.initData },
          body: JSON.stringify({ recipe, lang })
        })
          .then(res => (res.ok ? res.json() : Promise.reject(new Error(res.status))))
          .then(data => { state.translation = { id: r.id, lang, recipe: data.recipe }; })
          .catch(() => { state.translateError = t('errTranslate'); })
          .finally(() => {
            state.translating = false;
            render();
          });
        break;
      }

      case 'import': {
        const input = document.getElementById('import-text').value.trim();
        state.importText = input;
        if (state.importing) break;
        if (!input) {
          state.importError = t('importEmpty');
          render();
          break;
        }
        if (!tg || !tg.initData) {
          state.importError = t('importOnlyTg');
          render();
          break;
        }
        Object.assign(state, { importing: VIDEO_LINK.test(input) ? t('importingVideo') : t('importing'), importError: '' });
        render();
        apiPost('/api/import', { input, categories: userCategories() })
          .then(({ recipe: server }) => {
            const recipe = { ...fromServer(server), id: uid() };
            const next = [recipe, ...recipes];
            if (!writeJSON(KEY, next)) throw new Error('storage');
            recipes = next;
            state.importText = '';
            state.importing = '';
            haptic('success');
            go('recipe', { recipeId: recipe.id, servings: recipe.baseServings });
          })
          .catch(err => {
            state.importing = '';
            state.importError = err.message === 'youtube' ? t('importYoutube') : err.message === 'storage' ? t('errStorage') : t('importFailed');
            haptic('error');
            render();
          });
        break;
      }

      case 'toggle-translate':
        state.showTranslate = !state.showTranslate;
        state.translateError = '';
        render();
        break;

      case 'ui-lang':
        uiLang = el.dataset.lang;
        writeJSON(UI_LANG_KEY, uiLang);
        applyDir();
        render();
        break;

      case 'show-original':
        state.translation = null;
        render();
        break;

      case 'toggle-fav': {
        const next = recipes.map(x => (x.id === state.recipeId ? { ...x, favorite: !x.favorite } : x));
        if (writeJSON(KEY, next)) recipes = next;
        render();
        break;
      }

      case 'edit': {
        const r = recipes.find(x => x.id === state.recipeId);
        if (r) go('form', { draft: draftOf(r), editingId: r.id });
        break;
      }

      case 'cancel':
        goBack();
        break;

      case 'save':
        saveRecipe();
        break;

      case 'serv-inc':
        state.servings = Math.min(50, state.servings + 1);
        render();
        break;

      case 'serv-dec':
        state.servings = Math.max(1, state.servings - 1);
        render();
        break;

      case 'toggle-step': {
        const idx = Number(el.dataset.index);
        const list = done[state.recipeId] || [];
        done[state.recipeId] = list.includes(idx) ? list.filter(i => i !== idx) : [...list, idx];
        haptic('tap');
        writeJSON(DONE_KEY, done);
        render();
        break;
      }

      case 'reset-done':
        delete done[state.recipeId];
        writeJSON(DONE_KEY, done);
        render();
        break;

      case 'delete': {
        if (!state.confirmDelete) {
          state.confirmDelete = true;
          render();
          break;
        }
        recipes = recipes.filter(r => r.id !== state.recipeId);
        delete done[state.recipeId];
        writeJSON(KEY, recipes);
        writeJSON(DONE_KEY, done);
        state.query = '';
        goBack();
        break;
      }

      case 'new-cat':
        go('cat-form', { catDraft: { name: '', icon: CAT_ICONS[0] } });
        break;

      case 'pick-icon':
        readCatForm();
        state.catDraft.icon = el.dataset.icon;
        render();
        break;

      case 'save-cat': {
        const res = parseCategory(readCatForm(), allCategories());
        if (res.error) return fail(res.error);
        const next = [...customCats, res.category];
        if (!writeJSON(CATS_KEY, next)) return fail(t('errCatStorage'));
        customCats = next;
        goBack();
        break;
      }

      case 'pick-photo':
        document.getElementById('f-photo').click();
        break;

      case 'remove-photo':
        readForm();
        state.draft.photo = '';
        render();
        break;

      case 'add-row': {
        const d = readForm();
        d.ingredients.push({ name: '', amount: '', unit: '' });
        render();
        break;
      }

      case 'remove-row': {
        const d = readForm();
        const idx = Number(el.dataset.index);
        if (d.ingredients.length > 1) d.ingredients.splice(idx, 1);
        else d.ingredients = [{ name: '', amount: '', unit: '' }];
        render();
        break;
      }
    }
  });

  app.addEventListener('input', e => {
    if (e.target.id === 'import-text') state.importText = e.target.value;
    if (e.target.id !== 'search') return;
    state.query = e.target.value;
    document.getElementById('results').innerHTML = resultsHtml();
  });

  app.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (e.target.id !== 'f-photo' || !file || state.view !== 'form') return;
    readForm();
    compressPhoto(file)
      .then(photo => {
        state.draft.photo = photo;
        state.error = '';
        render();
      })
      .catch(() => fail(t('errPhotoFile')));
  });

  app.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('step')) {
      e.preventDefault();
      e.target.click();
    }
  });

  if (tg && tg.BackButton) tg.BackButton.onClick(goBack);

  recipes = loadRecipes();
  customCats = readJSON(CATS_KEY, []);
  done = readJSON(DONE_KEY, {});
  applyDir();
  render();
  syncFromServer();
</script>
</body>
</html>
