<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>Kirti</title>
<link rel="icon" type="image/png" href="img/icon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --text: #222222;
    --muted: #6A6A6A;
    --line: #EBEBEB;
    --line-strong: #DDDDDD;
    --field: #B0B0B0;
    --surface: #F7F7F7;
    --accent: #FF385C;
    --danger: #C13515;
    --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --safe-bottom: calc(var(--tg-safe-area-inset-bottom, 0px) + env(safe-area-inset-bottom, 0px));
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans Hebrew", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* Press feedback: transform/opacity only, so it stays on the compositor */
  .btn, .tool, .round, .heart, .step-btn, .lang, .emoji, .tab, .cat, .card-open, .row-link {
    transition: transform 150ms ease-out, opacity 150ms ease-out;
  }
  .btn:active, .tool:active, .round:active, .heart:active, .step-btn:active, .lang:active, .emoji:active, .tab:active { transform: scale(0.94); }
  .cat:active { opacity: 0.6; }
  .card-open:active { transform: scale(0.985); }
  .row-link:active { opacity: 0.6; }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(var(--safe-top) + 12px) 20px calc(var(--safe-bottom) + 112px);
  }
  .app.hero-view { padding-top: 0; }
  /* Motion: transform and opacity only, so it runs on the compositor and stays smooth */
  :root { --ease: cubic-bezier(0.22, 1, 0.36, 1); }
  .view-in { animation: viewin 320ms var(--ease); }
  @keyframes viewin { from { opacity: 0; transform: translateY(16px); } }
  .view-in .card:nth-child(-n+6) { animation: rise 460ms var(--ease) backwards; }
  .view-in .card:nth-child(2) { animation-delay: 50ms; }
  .view-in .card:nth-child(3) { animation-delay: 100ms; }
  .view-in .card:nth-child(4) { animation-delay: 150ms; }
  .view-in .card:nth-child(5) { animation-delay: 200ms; }
  .view-in .card:nth-child(6) { animation-delay: 250ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(28px) scale(0.97); } }
  .hero-view .view-in, .hero-view.view-in { animation: none; }
  .hero-view .view-in .hero img, .hero-view .view-in .hero .no-photo { animation: zoomout 700ms var(--ease); }
  @keyframes zoomout { from { transform: scale(1.12); } }
  .hero-view .view-in .sheet { animation: sheetup 520ms var(--ease); }
  @keyframes sheetup { from { transform: translateY(70px); opacity: 0; } }
  .hero-view .view-in .bottom-bar { animation: barup 420ms var(--ease) 120ms backwards; }
  @keyframes barup { from { transform: translateY(100%); } }
  .tabbar .tab.on .icon { animation: tabpop 360ms var(--ease); }
  @keyframes tabpop { 40% { transform: scale(1.22); } }
  .heart.pop .icon, .round.pop .icon { animation: heartpop 460ms var(--ease); }
  @keyframes heartpop { 0% { transform: scale(0.6); } 45% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .step.just .step-num { animation: heartpop 420ms var(--ease); }

  h1 { font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  h2 { font-size: 22px; line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 12px; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
  .top { margin-bottom: 16px; }
  .page-head { margin: 8px 0 24px; }

  /* Home header: logo, then a sticky search pill with the category bar */
  .topcover { position: fixed; top: 0; inset-inline: 0; height: var(--safe-top); background: var(--bg); z-index: 7; pointer-events: none; transition: opacity 150ms; }
  /* On the recipe page the photo may sit under the status bar until it scrolls away */
  .hero-view .topcover { opacity: 0; }
  body.scrolled .hero-view .topcover { opacity: 1; }
  .home-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .logo { display: block; height: 44px; width: auto; margin-inline-start: -4px; }
  .langs { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; flex: none; }
  .lang { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .lang.on { background: var(--text); color: #fff; }

  .home-sticky {
    position: sticky; top: var(--safe-top); z-index: 4; background: var(--bg);
    margin: 0 -20px 24px; padding: 8px 20px 0; border-bottom: 1px solid var(--line);
  }
  .search {
    display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 20px;
    background: #fff; border: 1px solid var(--line-strong); border-radius: 999px; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
  }
  .search .icon { width: 20px; height: 20px; stroke-width: 2.2; }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; padding: 0; background: transparent; outline: none; font-size: 15px; font-weight: 600; }
  .search input::placeholder { color: var(--muted); font-weight: 400; }
  .search input::-webkit-search-decoration { -webkit-appearance: none; }

  .cats { display: flex; gap: 28px; overflow-x: auto; margin: 12px -20px 0; padding: 0 20px; scrollbar-width: none; overscroll-behavior-x: contain; }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    position: relative; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0 12px;
    border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .cat .glyph { display: grid; place-items: center; height: 26px; font-size: 23px; line-height: 1; opacity: 0.7; }
  .cat .glyph .icon { width: 24px; height: 24px; stroke-width: 1.6; }
  .cat.on { color: var(--text); }
  .cat.on .glyph { opacity: 1; }
  .cat::after { content: ''; position: absolute; inset-inline: 0; bottom: 0; height: 2px; background: var(--text); opacity: 0; }
  .cat.on::after { opacity: 1; }

  /* Listing cards: one per row on phones, like the Airbnb feed */
  .feed { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
  @media (min-width: 560px) { .feed { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 16px; } }
  .card { position: relative; min-width: 0; }
  .card[hidden], .empty[hidden] { display: none; }
  .card-open { display: block; width: 100%; border: 0; padding: 0; background: none; text-align: start; }
  .card-photo { position: relative; display: block; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: var(--c, var(--surface)); }
  .card-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .no-photo { position: absolute; inset: 0; display: grid; place-items: center; font-size: 64px; background: var(--c, var(--surface)); }
  .card-badge {
    position: absolute; top: 12px; inset-inline-start: 12px; display: inline-flex; align-items: center; gap: 5px;
    background: #fff; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; line-height: 1.4;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
  }
  .card-badge .icon { width: 14px; height: 14px; }
  .card-title {
    display: -webkit-box; margin-top: 12px; font-size: 15px; font-weight: 600; line-height: 1.3;
    overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-meta { display: block; color: var(--muted); font-size: 15px; line-height: 1.35; margin-top: 2px; }
  .heart {
    position: absolute; top: 6px; inset-inline-end: 6px; width: 44px; height: 44px; border: 0; padding: 0; background: none;
    display: grid; place-items: center; color: #fff;
  }
  .heart .icon { width: 26px; height: 26px; stroke-width: 2; fill: rgba(0, 0, 0, 0.5); }
  .heart.on .icon { fill: var(--accent); }
  .empty { color: var(--muted); padding: 40px 0; margin: 0; text-align: center; }
  .empty p { margin: 0 0 20px; }

  /* Bottom tab bar */
  body.typing .tabbar { display: none; }
  .tabbar { position: fixed; inset-inline: 0; bottom: 0; z-index: 6; background: #fff; border-top: 1px solid var(--line); padding-bottom: var(--safe-bottom); }
  .tabbar[hidden] { display: none; }
  .tabbar .in { max-width: 520px; margin: 0 auto; display: flex; }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 0 7px;
    border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 600; line-height: 1.2;
  }
  .tab .icon { width: 24px; height: 24px; stroke-width: 1.8; }
  .tab.on { color: var(--accent); }

  /* Add screen */
  .import-row { display: flex; gap: 8px; align-items: flex-end; }
  .import textarea {
    display: block; width: 100%; min-height: 52px; max-height: 160px; flex: 1; min-width: 0; resize: none; field-sizing: content;
    border: 1px solid var(--field); border-radius: 12px; padding: 14px; line-height: 1.4; background: #fff;
  }
  .import textarea:focus { outline: none; border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  .import textarea::placeholder, .form ::placeholder { color: var(--muted); }
  .import .btn { flex: none; min-height: 52px; }
  .progress { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: 15px; }
  .left { margin: 8px 2px 0; font-size: 13px; color: var(--muted); }
  .left.none { color: var(--accent); }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--text); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .row-link {
    display: grid; grid-template-columns: 24px minmax(0, 1fr) 18px; gap: 16px; align-items: center; width: 100%;
    border: 0; border-bottom: 1px solid var(--line); background: none; padding: 18px 0; text-align: start;
  }
  .row-link .icon { width: 24px; height: 24px; stroke-width: 1.6; }
  .row-link .chev { width: 18px; height: 18px; color: var(--muted); }
  .row-link b { display: block; font-weight: 600; }
  .row-link small { display: block; color: var(--muted); font-size: 14px; line-height: 1.4; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 600; min-height: 48px;
  }
  .btn[disabled] { opacity: 0.4; }
  .btn-primary, .btn-dark { background: var(--text); color: #fff; }
  .btn-outline { background: #fff; border: 1px solid var(--text); color: var(--text); }
  .btn-soft { background: #fff; border: 1px solid var(--text); color: var(--text); }
  .btn-ghost { background: transparent; color: var(--text); text-decoration: underline; text-underline-offset: 3px; padding-inline: 4px; }
  .btn-danger { background: transparent; color: var(--danger); text-decoration: underline; text-underline-offset: 3px; padding-inline: 4px; }
  .link-btn { border: 0; background: none; padding: 0; color: var(--text); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  /* Recipe page */
  .hero { position: relative; margin: 0 -20px; width: calc(100% + 40px); aspect-ratio: 4 / 3; max-height: 60vh; overflow: hidden; background: var(--surface); }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero .no-photo { font-size: 110px; }
  .hero-bar { position: absolute; top: calc(var(--safe-top) + 12px); inset-inline: 16px; display: flex; gap: 10px; }
  .hero-bar .spacer { flex: 1; }
  .round {
    position: relative;
    width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center;
    background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
  }
  .round .icon { width: 18px; height: 18px; stroke-width: 2.2; }
  .round.on .icon { fill: var(--accent); stroke: var(--accent); }
  .sheet { position: relative; margin: -20px -20px 0; padding: 26px 20px 0; background: var(--bg); border-radius: 20px 20px 0 0; }
  .recipe-title { font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  .recipe-sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
  .divider { height: 1px; background: var(--line); margin: 24px 0; border: 0; }
  .highlights { display: grid; gap: 20px; }
  .hl { display: grid; grid-template-columns: 26px 1fr; gap: 16px; align-items: start; }
  .hl .icon { width: 26px; height: 26px; stroke-width: 1.5; }
  .hl b { display: block; font-weight: 600; }
  .hl span { display: block; color: var(--muted); font-size: 14px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; }
  .tool {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--text); background: #fff;
    border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 14px;
  }
  .tool .icon { width: 18px; height: 18px; }
  .tool.on { background: var(--surface); }
  .translate { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .translate input { flex: 1 1 160px; min-width: 0; border: 1px solid var(--field); border-radius: 8px; padding: 12px 14px; }
  .translate .btn { min-height: 46px; }

  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  .section-head h2 { margin: 0; }
  .servings { display: inline-flex; align-items: center; gap: 8px; }
  .step-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--field); background: #fff; display: grid; place-items: center; padding: 0; color: var(--text);
  }
  .step-btn[disabled] { opacity: 0.3; }
  .step-btn .icon { width: 14px; height: 14px; stroke-width: 2.4; }
  .serv-val { min-width: 76px; text-align: center; font-weight: 600; font-size: 15px; }
  .ingr { list-style: none; margin: 0; padding: 0; }
  .ingr li { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .ingr li:last-child { border-bottom: 0; }
  .ingr b { font-weight: 600; white-space: nowrap; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .step { display: grid; grid-template-columns: 28px 1fr; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .step:last-child { border-bottom: 0; }
  .step-num {
    width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--text); display: grid; place-items: center;
    font-weight: 600; font-size: 13px;
  }
  .step-num .icon { width: 15px; height: 15px; stroke-width: 3; }
  .step.done .step-num { background: var(--text); color: #fff; }
  .step.done .step-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .step-text { padding-top: 2px; }
  .end-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }

  /* Sticky bar with the link to the original, like Airbnb's Reserve bar */
  .bottom-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 6; background: #fff; border-top: 1px solid var(--line);
    padding: 12px 20px calc(var(--safe-bottom) + 12px);
  }
  .bottom-bar .in { max-width: 680px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .bottom-bar .src { min-width: 0; }
  .bottom-bar .btn { flex: none; white-space: nowrap; }
  .bottom-bar .src b { display: block; font-weight: 600; }
  .bottom-bar .src span { display: block; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Forms */
  .head { margin-bottom: 24px; }
  .form { display: grid; gap: 18px; }
  .form label, .field-title { display: grid; gap: 8px; color: var(--text); font-size: 14px; font-weight: 600; margin: 0; }
  .form input, .form select, .form textarea {
    width: 100%; border: 1px solid var(--field); background: #fff; border-radius: 8px; padding: 13px 14px; color: var(--text); font-weight: 400;
  }
  .form input:focus, .form select:focus, .form textarea:focus { outline: none; border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ingr-set { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
  .ingr-set legend { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .ing-row { display: grid; grid-template-columns: 1fr 72px 64px 36px; gap: 6px; }
  .btn-remove { border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
  .photo-box { display: grid; gap: 10px; }
  .photo-preview { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .emoji { border: 1px solid var(--line-strong); background: #fff; border-radius: 10px; font-size: 22px; aspect-ratio: 1; padding: 0; }
  .emoji.on { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  .actions { display: grid; gap: 10px; margin-top: 8px; }
  .error { color: var(--danger); margin: 10px 0 0; font-size: 15px; }

  /* Small round controls keep their look but get a 44px tap area */
  .step-btn, .lang, .btn-remove { position: relative; }
  .round::before, .step-btn::before, .lang::before, .btn-remove::before { content: ''; position: absolute; inset: -6px; }
  .lang::before { inset: -9px -2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .spinner { animation: spin 3s linear infinite !important; }
    *:active { transform: none !important; }
  }
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="tabbar" id="tabbar" hidden></nav>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const BG = '#FFFFFF';
  if (tg) {
    tg.ready();
    tg.expand();
    try {
      if (tg.isVersionAtLeast('8.0') && ['ios', 'android'].includes(tg.platform)) tg.requestFullscreen();
      if (tg.isVersionAtLeast('7.7')) tg.disableVerticalSwipes();
      tg.setHeaderColor(BG);
      tg.setBackgroundColor(BG);
      if (tg.setBottomBarColor) tg.setBottomBarColor(BG);
    } catch (e) {
      // older Telegram clients lack some of these; the app works without them
    }
  }
  // Telegram draws its own back button; the page shows one only in a plain browser
  const OWN_BACK = !(tg && tg.BackButton && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1'));
  const VIDEO_LINK = /(youtube\.com|youtu\.be|tiktok\.com|instagram\.com|facebook\.com|fb\.watch|t\.me)\//i;
  const OLD_BOT_CAT = 'Из бота';

  const KEY = 'recipe-book-v1';
  const DONE_KEY = 'recipe-book-done-v1';
  const CATS_KEY = 'recipe-book-cats-v1';
  const OFFERED_KEY = 'recipe-book-offered-v1';
  const MAX_PHOTO = 640; // px on the longest side; keeps localStorage usage small
  const BOT_USERNAME = 'recipe4katyabot'; // username бота без @; пока пусто, кнопка не показывается
  const API = 'https://recipe-book-tma.vercel.app';
  const IMPORTED_KEY = 'recipe-book-imported-v1';
  // Gemini does not report its quota, so imports are counted here per day (shortcut: per device, not per account)
  const IMPORT_LIMIT = 20;
  const IMPORT_KEY = 'recipe-book-imports-v1';
  const today = () => new Date().toISOString().slice(0, 10);
  const importsLeft = () => {
    const u = readJSON(IMPORT_KEY, {});
    return Math.max(0, IMPORT_LIMIT - (u.day === today() ? u.n : 0));
  };
  const countImport = () => writeJSON(IMPORT_KEY, { day: today(), n: IMPORT_LIMIT - importsLeft() + 1 });
  const LANG_KEY = 'recipe-book-lang-v1';
  // Suggestions only: any language name typed in the field is sent to Claude
  const LANGS = ['English', 'Русский', 'עברית', 'العربية', 'Українська', 'Español', 'Français', 'Deutsch', 'Italiano',
    'Português', 'Polski', 'Türkçe', 'Ελληνικά', 'Nederlands', 'Svenska', 'Čeština', 'Română', 'Magyar', 'Български',
    'Српски', 'ქართული', 'Հայերեն', 'Қазақша', 'Oʻzbekcha', 'فارسی', 'हिन्दी', '中文', '日本語', '한국어', 'Tiếng Việt',
    'ไทย', 'Bahasa Indonesia'];

  const CATEGORIES = [
    { name: 'Выпечка', icon: '🥐', color: '#F6E3C6' },
    { name: 'Супы', icon: '🍲', color: '#DDEBD6' },

  // Saved choice first, then the Telegram language; unknown languages get English, no hint at all keeps Russian
  function pickUiLang(saved, tgCode) {
    const code = saved || String(tgCode || '').slice(0, 2);
    return I18N[code] ? code : (code ? 'en' : 'ru');
  }
  let uiLang = pickUiLang(readJSON(UI_LANG_KEY, ''), tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code);
  const t = key => I18N[uiLang][key];
  // Category names stay Russian as storage keys; only built-in ones get a translated label
  const catLabel = name => t('cats')[name] || name;
  function applyDir() {
    document.documentElement.lang = uiLang;
    document.documentElement.dir = uiLang === 'he' ? 'rtl' : 'ltr';
  }

  // Seed recipes are offered once: new ones reach existing users, deleted ones stay deleted
  function missingSeeds(list, offered) {
    const add = SEED.filter(s => !offered.includes(s.title) && !list.some(r => r.title === s.title));
    return { add, offered: SEED.map(s => s.title) };
  }

  function loadRecipes() {
    const saved = readJSON(KEY, []);
    const list = Array.isArray(saved) ? saved : [];
    const { add, offered } = missingSeeds(list, readJSON(OFFERED_KEY, []));
    const next = [...list, ...add.map(r => ({ ...r, id: uid() }))];
    if (add.length) writeJSON(KEY, next);
    writeJSON(OFFERED_KEY, offered);
    return next;
  }

  // Bot recipes are imported once, like seeds: a recipe deleted in the app stays deleted
  function newFromServer(server, imported) {
    return { add: server.filter(s => !imported.includes(s.id)), imported: server.map(s => s.id) };
  }

  // Matches a category by stored name or by its label in any interface language
  function findCategory(name, cats) {
    const key = String(name || '').trim().toLowerCase();
    if (!key) return null;
    return cats.find(c => c.name !== OLD_BOT_CAT && (c.name.toLowerCase() === key ||
      Object.values(I18N).some(d => (d.cats[c.name] || '').toLowerCase() === key))) || null;
  }

  // Returns the category name to store, creating the category when the model proposed a new one
  function resolveCategory(name, icon) {
    const found = findCategory(name, allCategories());
    if (found) return found.name;
    const clean = String(name || '').trim().slice(0, 30);
    if (!clean) return CATEGORIES[2].name;
    const cat = { name: clean, icon: icon || '🍽️', color: PALETTE[customCats.length % PALETTE.length] };
    customCats = [...customCats, cat];
    writeJSON(CATS_KEY, customCats);
    return cat.name;
  }

  // A recipe the server extracted (bot draft or Mini App import) in the shape the app stores
  function fromServer(s) {
    return {
      title: String(s.title || ''),
      photo: s.photo || '',
      category: resolveCategory(s.category, s.categoryIcon),
      time: Number(s.time) || 0,
      timeEstimated: !!s.timeEstimated,
      baseServings: Number(s.servings) || 4,
      ingredients: (s.ingredients || []).map(i => (typeof i === 'string'
        ? { name: i, amount: '', unit: '' }
        : { name: String(i.name || ''), amount: String(i.amount ?? ''), unit: String(i.unit ?? '') })),
      steps: (s.steps || []).map(String),
      source: safeUrl(s.source),
      ai: true
    };
  }

  // Only plain web links are opened; anything else is dropped
  function safeUrl(value) {
    const text = String(value || '').trim();
    return /^https?:\/\/[^\s"'<>]+$/i.test(text) ? text : '';
  }

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^(www|m)\./, ''); } catch (e) { return ''; }
  }

  function apiPost(path, body) {
    return fetch(`${API}${path}`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-telegram-init-data': tg.initData },
      body: JSON.stringify(body)
    }).then(async res => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || String(res.status));
      return data;
    });
  }

  function userCategories() {
    return allCategories().filter(c => c.name !== OLD_BOT_CAT).map(c => c.name);
  }

  // Recipes saved before auto-categories sat in one "from the bot" category; sort them once
  async function migrateBotCategory() {
    for (const r of recipes.filter(x => x.category === OLD_BOT_CAT)) {
      const text = [r.title, ...r.ingredients.map(i => [i.name, i.amount, i.unit].filter(Boolean).join(' ')), ...r.steps].join('\n');
      try {
        const m = fromServer((await apiPost('/api/import', { input: text.slice(0, 8000), categories: userCategories() })).recipe);
        recipes = recipes.map(x => (x.id === r.id ? {
          ...x, category: m.category, time: x.time || m.time, timeEstimated: x.time ? !!x.timeEstimated : m.timeEstimated,
          baseServings: m.baseServings, ingredients: m.ingredients.length ? m.ingredients : x.ingredients, ai: true
        } : x));
        writeJSON(KEY, recipes);
      } catch (err) {
        console.error('migrate failed', err.message);
      }
    }
    if (!recipes.some(r => r.category === OLD_BOT_CAT) && customCats.some(c => c.name === OLD_BOT_CAT)) {
      customCats = customCats.filter(c => c.name !== OLD_BOT_CAT);
      writeJSON(CATS_KEY, customCats);
    }
    render();
  }

  function syncFromServer() {
    if (!tg || !tg.initData) return;
    fetch(`${API}/api/recipes`, { headers: { 'x-telegram-init-data': tg.initData } })
      .then(res => (res.ok ? res.json() : Promise.reject(new Error(res.status))))
      .then(({ recipes: server }) => {
        const { add, imported } = newFromServer(server, readJSON(IMPORTED_KEY, []));
        if (add.length) {
          recipes = [...add.map(s => ({ ...fromServer(s), id: s.id })), ...recipes];
          if (!writeJSON(KEY, recipes)) return;
        }
        writeJSON(IMPORTED_KEY, imported);
        if (add.length) render();
      })
      .catch(err => console.error('sync failed', err.message))
      .finally(() => {
        if (recipes.some(r => r.category === OLD_BOT_CAT)) migrateBotCategory();
      });
  }

  function haptic(kind) {

      const h = tg && tg.HapticFeedback;
      if (!h) return;

  function catOf(name) {

  function fmtTime(minutes) {
    if (!minutes) return t('noTime');
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return [h ? `${h} ${t('h')}` : '', m ? `${m} ${t('min')}` : ''].filter(Boolean).join(' ');
  }

  function timeText(r) {

  function fmtNum(n) {
    return String(Math.round(n * 100) / 100).replace('.', ',');

  function scale(amount, factor) {
    const text = String(amount).trim();
    const fraction = text.match(/^(\d+)\s*\/\s*(\d+)$/);
    const n = fraction ? fraction[1] / fraction[2] : parseFloat(text.replace(',', '.'));
    return isNaN(n) ? text : fmtNum(n * factor);
  }

  // Scales the photo down and re-encodes it as JPEG so the data URL stays small
  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, MAX_PHOTO / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * k);
        canvas.height = Math.round(img.height * k);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('bad image'));
      };
      img.src = url;
    });
  }

  // Top-level screens shown with the bottom tab bar; they have no back button
  const TABS = ['home', 'favs', 'add'];

  function go(view, patch = {}, { replace = false } = {}) {
    if (!replace) state.history = [...state.history, { view: state.view, category: state.category, recipeId: state.recipeId, servings: state.servings, restoreScroll: window.scrollY || 0 }];
    Object.assign(state, { view, error: '', confirmDelete: false, restoreScroll: 0 }, patch);
    render();
  }

  function goBack() {
    if (TABS.includes(state.view)) return;
    const prev = state.history.at(-1) || { view: 'home' };
    state.history = state.history.slice(0, -1);
    Object.assign(state, prev, { error: '', confirmDelete: false });
    render();
  }

  function switchTab(view) {
    if (state.view === view) {
      window.scrollTo(0, 0);
      return;
    }
    if (state.view === 'home') state.homeScroll = window.scrollY || 0;
    Object.assign(state, { view, history: [], error: '', confirmDelete: false, restoreScroll: view === 'home' ? state.homeScroll || 0 : 0 });
    render();
  }

  const heartBtn = (r, cls = 'heart') =>
    `<button class="${cls}${r.favorite ? ' on' : ''}" data-action="toggle-fav" data-id="${esc(r.id)}" aria-pressed="${!!r.favorite}" aria-label="${r.favorite ? t('inFav') : t('toFav')}">${icon('heart')}</button>`;

  function card(r, hidden = false) {
    const cat = catOf(r.category);
    const isVideo = r.source && VIDEO_LINK.test(r.source);
    const badge = isVideo ? `<span class="card-badge">${icon('play')}${t('video')}</span>`
      : r.ai ? `<span class="card-badge">${icon('sparkle')}${t('aiShort')}</span>` : '';
    const facts = [r.time ? timeText(r) : '', r.ingredients.length ? `${r.ingredients.length} ${t('ingrCount')}` : ''].filter(Boolean).join(' · ');
    return `
      <article class="card" data-id="${esc(r.id)}"${hidden ? ' hidden' : ''}>
        <button class="card-open" data-action="open-recipe" data-id="${esc(r.id)}">

  // Every recipe is rendered once; search and category only hide cards, so photos are never rebuilt while typing
  function resultsHtml() {

    const shown = recipes.filter(matches);
    return `<div class="feed">${recipes.map(r => card(r, !matches(r))).join('')}</div>
      <p class="empty" id="results-empty"${shown.length ? ' hidden' : ''}>${noMatchText()}</p>`;

  function applyFilter() {
    const byId = new Map(recipes.map(r => [r.id, r]));
    let shown = 0;
    document.querySelectorAll('#results .card').forEach(el => {
      const r = byId.get(el.dataset.id);
      const ok = !!r && matches(r);
      el.hidden = !ok;
      if (ok) shown++;
    });
    const empty = document.getElementById('results-empty');
    if (empty) {
      empty.hidden = shown > 0;
      empty.textContent = noMatchText();
    }
  }

  function refreshEndActions() {

  function renderForm() {
    const d = state.draft;

      `<option value="${esc(c.name)}"${c.name === d.category ? ' selected' : ''}>${esc(c.icon)} ${esc(catLabel(c.name))}</option>`

      <div class="form">

          <button class="btn btn-soft" data-action="pick-photo">${d.photo ? t('replacePhoto') : t('addPhoto')}</button>

  // Full redraw: only for screen changes and rare events; frequent taps patch the DOM in place
  function render() {
    const views = { home: renderHome, favs: renderFavs, add: renderAdd, recipe: renderRecipe, form: renderForm, 'cat-form': renderCatForm };
    const body = views[state.view]();
    const hero = state.view === 'recipe';
    const isTab = TABS.includes(state.view);
    const back = isTab || hero || !OWN_BACK ? '' : `<div class="top"><button class="round" data-action="back" aria-label="${t('back')}">${icon('back', 'flip')}</button></div>`;
    const entering = state.view !== lastView || (hero && state.recipeId !== lastRecipe);
    app.classList.toggle('hero-view', hero);
    app.innerHTML = `<div class="topcover" aria-hidden="true"></div><div class="view${entering && lastView ? ' view-in' : ''}">${back}${body}</div>`;
    onScroll();
    if (entering) {
      window.scrollTo(0, state.restoreScroll || 0);
      lastView = state.view;
      lastRecipe = state.recipeId;
    }
    tabbar.hidden = !isTab;
    if (isTab) tabbar.innerHTML = tabbarHtml();
    if (tg && tg.BackButton) {
      if (isTab) tg.BackButton.hide();
      else tg.BackButton.show();
    }
  }

  function fail(message) {
    state.error = message;
    render();
  }

  // Turns raw form values into a recipe, or { error } with the first problem found
  function parseRecipe(d) {
    const title = d.name.trim();
    const time = d.time.trim();
    const servings = d.servings.trim();
    const ingredients = d.ingredients
      .map(i => ({ name: i.name.trim(), amount: i.amount.trim().replace(',', '.'), unit: i.unit.trim() }))
      .filter(i => i.name);
    const steps = d.steps.split('\n').map(s => s.trim()).filter(Boolean);
    const source = String(d.source || '').trim();

    if (!title) return { error: t('errTitle') };
    if (title.length > 80) return { error: t('errTitleLong') };
    if (!allCategories().some(c => c.name === d.category)) return { error: t('errCat') };
    if (time && !/^\d+$/.test(time)) return { error: t('errTime') };
    if (!/^\d+$/.test(servings) || Number(servings) < 1) return { error: t('errServ') };
    if (!ingredients.length) return { error: t('errIngr') };
    if (!steps.length) return { error: t('errSteps') };
    if (source && !safeUrl(source)) return { error: t('errSource') };

    return {
      recipe: {
        title,
        category: d.category,
        time: Number(time) || 0,
        baseServings: Number(servings),
        ingredients,
        steps,
        source,
        photo: d.photo
      }
    };
  }

  function parseCategory(c, existing) {
    const name = c.name.trim();
    if (!name) return { error: t('errCatName') };
    if (name.length > 30) return { error: t('errCatLong') };
    if (existing.some(x => x.name.toLowerCase() === name.toLowerCase())) return { error: t('errCatExists') };
    if (!c.icon) return { error: t('errEmoji') };
    return { category: { name, icon: c.icon, color: PALETTE[(existing.length - CATEGORIES.length) % PALETTE.length] } };
  }

  function readCatForm() {
    state.catDraft.name = document.getElementById('c-name').value;
    return state.catDraft;
  }

  function saveRecipe() {
    const parsed = parseRecipe(readForm());
    if (parsed.error) return fail(parsed.error);
    const old = recipes.find(r => r.id === state.editingId) || {};
    const recipe = {
      ...parsed.recipe,
      id: state.editingId || uid(),
      favorite: !!old.favorite,
      ai: !!old.ai,
      timeEstimated: !!old.timeEstimated && parsed.recipe.time === old.time
    };

    const next = state.editingId
      ? recipes.map(r => (r.id === recipe.id ? recipe : r))
      : [recipe, ...recipes];
    if (!writeJSON(KEY, next)) {
      return fail(t('errStorage'));
    }
    recipes = next;

    if (state.editingId) {
      delete done[recipe.id];
      writeJSON(DONE_KEY, done);
      state.history = state.history.slice(0, -1); // drop the recipe screen the edit came from
    }

    go('recipe', { recipeId: recipe.id, servings: recipe.baseServings }, { replace: true });
  }

  function onClick(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;

    switch (el.dataset.action) {
      case 'back':
        goBack();
        break;

      case 'tab':
        switchTab(el.dataset.tab);
        break;

      case 'filter': {
        if (state.category === el.dataset.cat) break;
        state.category = el.dataset.cat;
        document.querySelectorAll('.cat[data-cat]').forEach(b => {
          const on = b.dataset.cat === state.category;
          b.classList.toggle('on', on);
          b.setAttribute('aria-pressed', String(on));
        });
        const results = document.getElementById('results');
        applyFilter();
        // When the list was scrolled under the sticky header, start the new list right below it
        const sticky = document.querySelector('.home-sticky');
        if (sticky) {
          const gap = results.getBoundingClientRect().top - sticky.getBoundingClientRect().bottom;
          if (gap < 0) window.scrollBy(0, gap - 16);
        }
        el.scrollIntoView({ inline: 'nearest', block: 'nearest' });
        haptic('tap');
        break;
      }

      case 'open-source': {
        const r = currentRecipe();
        const url = r && safeUrl(r.source);
        if (!url) break;
        if (tg && /^https:\/\/t\.me\//i.test(url)) tg.openTelegramLink(url);
        else if (tg) tg.openLink(url);
        else window.open(url, '_blank', 'noopener');
        break;
      }

      case 'open-recipe': {
        const r = recipes.find(x => x.id === el.dataset.id);
        if (r) go('recipe', { recipeId: r.id, servings: r.baseServings, showTranslate: false, translateError: '' });
        break;
      }

      case 'new':
        go('form', { draft: blankDraft(state.category), editingId: '' });
        break;

      case 'open-bot': {
        const url = `https://t.me/${BOT_USERNAME}`;
        if (tg) tg.openTelegramLink(url);
        else window.open(url, '_blank');
        break;
      }

      case 'translate': {
        const r = currentRecipe();
        const lang = document.getElementById('t-lang').value.trim();
        if (!r || state.translating) break;
        if (!lang) {
          state.translateError = t('errLang');
          refreshSheet();
          break;
        }
        if (!tg || !tg.initData) {
          state.translateError = t('errOnlyTg');
          refreshSheet();
          break;
        }
        writeJSON(LANG_KEY, lang);
        Object.assign(state, { translating: true, translateError: '' });
        refreshSheet();
        const recipe = {
          title: String(r.title),
          ingredients: r.ingredients.map(i => ({ name: String(i.name ?? ''), amount: String(i.amount ?? ''), unit: String(i.unit ?? '') })),
          steps: r.steps.map(String)
        };
        fetch(`${API}/api/translate`, {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-telegram-init-data': tg.initData },
          body: JSON.stringify({ recipe, lang })
        })
          .then(res => (res.ok ? res.json() : Promise.reject(new Error(res.status))))
          .then(data => { state.translation = { id: r.id, lang, recipe: data.recipe }; })
          .catch(() => { state.translateError = t('errTranslate'); })
          .finally(() => {
            state.translating = false;
            refreshSheet();
          });
        break;
      }

      case 'import': {
        const input = document.getElementById('import-text').value.trim();
        state.importText = input;
        if (state.importing) break;
        if (!input) {
          state.importError = t('importEmpty');
          render();
          break;
        }
        if (!importsLeft()) {
          state.importError = t('importNone');
          render();
          break;
        }
        if (!tg || !tg.initData) {
          state.importError = t('importOnlyTg');
          render();
          break;
        }
        Object.assign(state, { importing: VIDEO_LINK.test(input) ? t('importingVideo') : t('importing'), importError: '' });
        render();
        apiPost('/api/import', { input, categories: userCategories() })
          .then(({ recipe: server }) => {
            const recipe = { ...fromServer(server), id: uid() };
            const next = [recipe, ...recipes];
            if (!writeJSON(KEY, next)) throw new Error('storage');
            recipes = next;
            countImport();
            state.importText = '';
            state.importing = '';
            haptic('success');
            go('recipe', { recipeId: recipe.id, servings: recipe.baseServings });
          })
          .catch(err => {
            state.importing = '';
            state.importError = err.message === 'youtube' ? t('importYoutube') : err.message === 'storage' ? t('errStorage') : t('importFailed');
            haptic('error');
            render();
          });
        break;
      }

      case 'toggle-translate':
        state.showTranslate = !state.showTranslate;
        state.translateError = '';
        refreshSheet();
        break;

      case 'ui-lang':
        uiLang = el.dataset.lang;
        writeJSON(UI_LANG_KEY, uiLang);
        applyDir();
        render();
        break;

      case 'show-original':
        state.translation = null;
        refreshSheet();
        break;

      case 'toggle-fav': {
        const id = el.dataset.id || state.recipeId;
        const target = recipes.find(x => x.id === id);
        if (!target) break;
        const fav = !target.favorite;
        const next = recipes.map(x => (x.id === id ? { ...x, favorite: fav } : x));
        haptic('tap');
        if (!writeJSON(KEY, next)) break;
        recipes = next;
        // Patch every heart for this recipe instead of redrawing the page
        document.querySelectorAll('[data-action="toggle-fav"]').forEach(b => {
          if (b.dataset.id !== id) return;
          b.classList.toggle('on', fav);
          b.classList.remove('pop');
          if (fav) { void b.offsetWidth; b.classList.add('pop'); }
          b.setAttribute('aria-pressed', String(fav));
          b.setAttribute('aria-label', fav ? t('inFav') : t('toFav'));
        });
        if (state.view === 'favs' && !fav) {
          const item = el.closest('.card');
          if (item) item.remove();
          if (!recipes.some(x => x.favorite)) document.getElementById('results').innerHTML = favsHtml();
        }
        break;
      }

      case 'edit': {
        const r = currentRecipe();
        if (r) go('form', { draft: draftOf(r), editingId: r.id });
        break;
      }

      case 'cancel':
        goBack();
        break;

      case 'save':
        saveRecipe();
        break;

      case 'serv-inc':
      case 'serv-dec': {
        const r = currentRecipe();
        if (!r) break;
        state.servings = Math.min(50, Math.max(1, state.servings + (el.dataset.action === 'serv-inc' ? 1 : -1)));
        haptic('tap');
        document.getElementById('serv-val').textContent = `${state.servings} ${portions(state.servings)}`;
        document.getElementById('serv-dec').disabled = state.servings <= 1;
        document.getElementById('ingr').innerHTML = ingrItems(shownOf(r).shown.ingredients, state.servings / r.baseServings);
        break;
      }

      case 'toggle-step': {
        const idx = Number(el.dataset.index);
        const list = done[state.recipeId] || [];
        const isDone = !list.includes(idx);
        done[state.recipeId] = isDone ? [...list, idx] : list.filter(i => i !== idx);
        haptic('tap');
        writeJSON(DONE_KEY, done);
        el.classList.toggle('done', isDone);
        el.classList.remove('just');
        if (isDone) { void el.offsetWidth; el.classList.add('just'); }
        el.setAttribute('aria-pressed', String(isDone));
        el.querySelector('.step-num').innerHTML = isDone ? icon('check') : String(idx + 1);
        refreshEndActions();
        break;
      }

      case 'reset-done':
        delete done[state.recipeId];
        writeJSON(DONE_KEY, done);
        refreshSheet();
        break;

      case 'delete': {
        if (!state.confirmDelete) {
          state.confirmDelete = true;
          refreshEndActions();
          break;
        }
        recipes = recipes.filter(r => r.id !== state.recipeId);
        delete done[state.recipeId];
        writeJSON(KEY, recipes);
        writeJSON(DONE_KEY, done);
        state.query = '';
        goBack();
        break;
      }

      case 'new-cat':
        go('cat-form', { catDraft: { name: '', icon: CAT_ICONS[0] } });
        break;

      case 'pick-icon':
        readCatForm();
        state.catDraft.icon = el.dataset.icon;
        render();
        break;

      case 'save-cat': {
        const res = parseCategory(readCatForm(), allCategories());
        if (res.error) return fail(res.error);
        const next = [...customCats, res.category];
        if (!writeJSON(CATS_KEY, next)) return fail(t('errCatStorage'));
        customCats = next;
        goBack();
        break;
      }

      case 'pick-photo':
        document.getElementById('f-photo').click();
        break;

      case 'remove-photo':
        readForm();
        state.draft.photo = '';
        render();
        break;

      case 'add-row': {
        const d = readForm();
        d.ingredients.push({ name: '', amount: '', unit: '' });
        render();
        break;
      }

      case 'remove-row': {
        const d = readForm();
        const idx = Number(el.dataset.index);
        if (d.ingredients.length > 1) d.ingredients.splice(idx, 1);
        else d.ingredients = [{ name: '', amount: '', unit: '' }];
        render();
        break;
      }
    }
  }

  const tabbar = document.getElementById('tabbar');
  app.addEventListener('click', onClick);
  tabbar.addEventListener('click', onClick);
  // The keyboard pushes fixed bars up on Android; hide the tab bar while a field has focus
  const isField = el => el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && el.type !== 'file';
  app.addEventListener('focusin', e => { if (isField(e.target)) document.body.classList.add('typing'); });
  app.addEventListener('focusout', e => { if (isField(e.target)) document.body.classList.remove('typing'); });

  // One cheap class flip when the recipe photo leaves the screen; no per-frame work
  let scrolled = false;
  function onScroll() {
    const now = state.view === 'recipe' && window.scrollY > 180;
    if (now !== scrolled) document.body.classList.toggle('scrolled', scrolled = now);
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  app.addEventListener('input', e => {
    if (e.target.id === 'import-text') state.importText = e.target.value;
    if (e.target.id !== 'search') return;
    state.query = e.target.value;
    applyFilter();
  });

  app.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (e.target.id !== 'f-photo' || !file || state.view !== 'form') return;
    readForm();
    compressPhoto(file)
      .then(photo => {
        state.draft.photo = photo;
        state.error = '';
        render();
      })
      .catch(() => fail(t('errPhotoFile')));
  });

  app.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('step')) {
      e.preventDefault();
      e.target.click();
    }
  });

  if (tg && tg.BackButton) tg.BackButton.onClick(goBack);

  recipes = loadRecipes();
  customCats = readJSON(CATS_KEY, []);
  done = readJSON(DONE_KEY, {});
  applyDir();
  render();
  syncFromServer();
</script>
</body>
</html>
