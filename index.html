<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>Книга рецептов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --text: #222222;
    --muted: #717171;
    --line: #EBEBEB;
    --line-strong: #DDDDDD;
    --surface: #F7F7F7;
    --accent: #E3385A;
    --danger: #C13515;
    --shadow-float: 0 6px 20px rgba(0, 0, 0, 0.12);
    --shadow-pill: 0 3px 12px rgba(0, 0, 0, 0.1);
    --safe-top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --safe-bottom: calc(var(--tg-safe-area-inset-bottom, 0px) + env(safe-area-inset-bottom, 0px));
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 500 16px/1.5 'Manrope', 'Rubik', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  [dir="rtl"] body { font-family: 'Rubik', system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; user-select: none; -webkit-user-select: none; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  [dir="rtl"] .flip { transform: scaleX(-1); }

  /* Press feedback: everything tappable sinks a little, so a tap feels deliberate */
  .btn, .tool, .round, .heart, .card-open, .fab, .step-btn, .lang, .emoji, .link-btn {
    transition: transform 180ms var(--ease), opacity 180ms var(--ease), background-color 180ms var(--ease), box-shadow 180ms var(--ease);
  }
  .btn:active, .tool:active, .round:active, .heart:active, .fab:active, .step-btn:active, .lang:active, .emoji:active { transform: scale(0.94); }
  .card-open:active { transform: scale(0.98); }

  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: calc(var(--safe-top) + 16px) 20px calc(var(--safe-bottom) + 110px);
  }
  .app.hero-view { padding-top: 0; }
  .app.enter > * { animation: enter 320ms var(--ease) both; }
  .app.enter > *:nth-child(2) { animation-delay: 30ms; }
  .app.enter > *:nth-child(3) { animation-delay: 60ms; }
  .app.enter > *:nth-child(n+4) { animation-delay: 90ms; }
  @keyframes enter { from { opacity: 0; transform: translateY(12px); } }
  .fade { animation: fade 260ms var(--ease) both; }
  /* Cards rise one after another when a list appears */
  .stagger .card { animation: rise 520ms var(--ease) both; animation-delay: calc(min(var(--i), 8) * 45ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(0.97); } }
  /* With view transitions the photo morphs from the card into the page; the sheet slides up under it */
  .app.vt .sheet { animation: sheet-up 560ms var(--ease) both; }
  .app.vt .bottom-bar, .app.enter .bottom-bar { animation: bar-up 480ms var(--ease) 180ms both; }
  @keyframes sheet-up { from { transform: translateY(70px); opacity: 0; } }
  @keyframes bar-up { from { transform: translateY(100%); } }
  ::view-transition-group(*) { animation-duration: 460ms; animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1); }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 260ms; }
  .hero img, .hero .no-photo { will-change: transform; }
  .step.just .step-num { animation: pop 420ms var(--ease); }
  .bump .serv-val, .bump .ingr b { animation: bump 360ms var(--ease); }
  @keyframes bump { 40% { transform: scale(1.12); color: var(--accent); } }
  .ingr b { display: inline-block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  /* Header */
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .round {
    width: 36px; height: 36px; border-radius: 50%; border: 0; display: grid; place-items: center;
    background: #fff; color: var(--text); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.12);
  }
  .round .icon { width: 18px; height: 18px; stroke-width: 2.4; }
  .home-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 26px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
  h2 { font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 14px; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .langs { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; flex: none; }
  .lang { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; color: var(--muted); }
  .lang.on { background: var(--text); color: #fff; }

  /* Search pill */
  .search {
    position: relative; display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 0 20px; box-shadow: var(--shadow-pill);
  }
  .search .icon { color: var(--text); stroke-width: 2.4; width: 18px; height: 18px; }
  .search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 15px 0; font-weight: 600; outline: none; }
  .search input::placeholder { color: var(--muted); font-weight: 500; }

  /* Import card */
  .import {
    position: relative; border-radius: 22px; padding: 18px; margin-bottom: 22px; overflow: hidden;
    background: radial-gradient(120% 140% at 100% 0%, #FFE3CF 0%, #FFF4EC 55%, #FFF8F2 100%);
  }
  .import-icon {
    position: absolute; top: 16px; inset-inline-end: 16px; width: 40px; height: 40px; border-radius: 50%; background: #fff;
    display: grid; place-items: center; color: #E8743B; box-shadow: 0 6px 16px -6px rgba(232, 116, 59, 0.6);
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-4px) rotate(8deg); } }
  .import textarea { border-color: transparent !important; box-shadow: 0 2px 10px -4px rgba(0, 0, 0, 0.15); }
  .import h2 { font-size: 18px; margin-bottom: 4px; }
  .import .sub { margin: 0 0 12px; font-size: 14px; line-height: 1.4; }
  .import-row { display: flex; gap: 8px; align-items: flex-end; }
  .import textarea {
    display: block; width: 100%; min-height: 48px; max-height: 160px; flex: 1; min-width: 0; resize: none; field-sizing: content;
    border: 1px solid var(--line-strong); border-radius: 12px; padding: 12px 14px; line-height: 1.4; background: #fff;
    transition: border-color 160ms, box-shadow 160ms;
  }
  .import textarea:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .import textarea::placeholder, .field::placeholder { color: var(--muted); }
  .import .btn-primary { flex: none; padding: 0 18px; }
  .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  .link-btn { border: 0; background: none; padding: 0; color: var(--text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .progress { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: 15px; }
  .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 10px; padding: 13px 22px; font-weight: 700; min-height: 48px;
  }
  .btn[disabled] { opacity: 0.45; }
  .btn-primary { background: var(--text); color: #fff; }
  .btn-primary:active { background: #000; }
  .btn-dark { background: var(--text); color: #fff; }
  .btn-outline { background: #fff; border: 1px solid var(--text); color: var(--text); }
  .btn-soft { background: var(--surface); color: var(--text); }
  .btn-ghost { background: transparent; color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .btn-danger { background: transparent; color: var(--danger); }
  .fab {
    position: fixed; inset-inline-end: max(20px, calc(50vw - 320px)); bottom: calc(var(--safe-bottom) + 22px);
    display: inline-flex; align-items: center; gap: 8px; height: 52px; padding: 0 22px 0 18px; border-radius: 999px; border: 0;
    background: var(--text); color: #fff; font-weight: 700; box-shadow: var(--shadow-float); z-index: 5;
  }
  .fab .icon { stroke-width: 2.6; }

  /* Category bar: emoji over label, underline marks the chosen one */
  .cats {
    display: flex; gap: 26px; overflow-x: auto; margin: 0 -20px 22px; padding: 0 20px;
    border-bottom: 1px solid var(--line); scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    position: relative; flex: none; display: grid; justify-items: center; gap: 6px; padding: 4px 0 12px;
    border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap;
    transition: color 200ms var(--ease);
  }
  .cat .glyph {
    width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; line-height: 1;
    background: var(--c, var(--surface)); transition: transform 240ms var(--ease), box-shadow 240ms var(--ease);
  }
  .cat:active .glyph { transform: scale(0.9); }
  .cat.on .glyph { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--text); transform: translateY(-2px); }
  .cat .glyph .icon { width: 24px; height: 24px; stroke-width: 1.7; }
  .cat::after {
    content: ''; position: absolute; inset-inline: 0; bottom: -1px; height: 2px; background: var(--text);
    transform: scaleX(0); transition: transform 240ms var(--ease);
  }
  .cat.on { color: var(--text); }
  .cat.on::after { transform: scaleX(1); }
  .cat.add .glyph { background: #fff; border: 1.5px dashed var(--line-strong); }

  /* Recipe cards */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; }
  .card { position: relative; min-width: 0; }
  .card-open { display: block; width: 100%; border: 0; padding: 0; background: none; text-align: start; }
  .card-photo {
    position: relative; display: block; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--surface);
  }
  .card-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 400ms var(--ease); }
  .card-open:active .card-photo img { transform: scale(1.04); }
  .no-photo { position: absolute; inset: 0; display: grid; place-items: center; font-size: 52px; background: var(--c, var(--surface)); }
  .card-badge {
    position: absolute; top: 10px; inset-inline-start: 10px; display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255, 255, 255, 0.94); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700;
  }
  .card-badge .icon { width: 13px; height: 13px; color: var(--accent); }
  .card-title { display: block; margin-top: 10px; font-weight: 700; font-size: 15px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card-meta { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; margin-top: 2px; }
  .heart {
    position: absolute; top: 6px; inset-inline-end: 6px; width: 36px; height: 36px; border: 0; background: none; padding: 0;
    display: grid; place-items: center; color: #fff;
  }
  .heart .icon { width: 24px; height: 24px; stroke-width: 2; fill: rgba(0, 0, 0, 0.45); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3)); }
  .heart.on .icon, .round.on .icon { fill: var(--accent); color: var(--accent); stroke: #fff; }
  .round.on .icon { stroke: var(--accent); }
  .heart.pop .icon, .round.pop .icon { animation: pop 380ms var(--ease); }
  @keyframes pop { 40% { transform: scale(1.3); } }
  .empty { color: var(--muted); padding: 32px 0; margin: 0; text-align: center; }

  /* Recipe page */
  .hero { position: relative; margin: 0 -20px; aspect-ratio: 4 / 3; max-height: 62vh; width: calc(100% + 40px); overflow: hidden; background: var(--surface); }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero .no-photo { font-size: 110px; }
  .hero-bar {
    position: absolute; top: calc(var(--safe-top) + 12px); inset-inline: 20px; display: flex; justify-content: space-between; gap: 10px;
  }
  .hero-bar .spacer { flex: 1; }
  .sheet { position: relative; margin: -24px -20px 0; padding: 28px 20px 0; background: var(--bg); border-radius: 24px 24px 0 0; }
  .recipe-title { font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
  .recipe-sub { margin: 6px 0 0; color: var(--text); font-weight: 600; }
  .recipe-sub .muted { color: var(--muted); font-weight: 500; }
  .divider { height: 1px; background: var(--line); margin: 24px 0; border: 0; }
  .highlights { display: grid; gap: 20px; }
  .hl { display: grid; grid-template-columns: 28px 1fr; gap: 16px; align-items: start; }
  .hl .icon { width: 26px; height: 26px; stroke-width: 1.6; margin-top: 1px; }
  .hl b { display: block; font-weight: 700; }
  .hl span { display: block; color: var(--muted); font-size: 14px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; }
  .tool {
    display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: #fff;
    border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 14px;
  }
  .tool .icon { width: 18px; height: 18px; }
  .tool.on { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .translate { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .translate input { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px 14px; }
  .translate .btn { min-height: 46px; }

  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .section-head h2 { margin: 0; }
  .servings { display: inline-flex; align-items: center; gap: 10px; }
  .step-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-strong); background: #fff; display: grid; place-items: center; padding: 0; color: var(--text);
  }
  .step-btn .icon { width: 14px; height: 14px; stroke-width: 2.6; }
  .serv-val { min-width: 76px; text-align: center; font-weight: 700; font-size: 15px; }
  .ingr { list-style: none; margin: 0; padding: 0; }
  .ingr li { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .ingr li:last-child { border-bottom: 0; }
  .ingr b { font-weight: 700; white-space: nowrap; }
  .steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
  .step {
    display: grid; grid-template-columns: 32px 1fr; gap: 14px; padding: 16px; border-radius: 18px; cursor: pointer;
    background: var(--surface); transition: background-color 220ms var(--ease), transform 180ms var(--ease);
  }
  .step:active { transform: scale(0.98); }
  .step.done { background: #F0F7F1; }
  .step-num { background: #fff; }
  .step:active { background: var(--surface); }
  .step-num {
    width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--text); display: grid; place-items: center;
    font-weight: 800; font-size: 14px; transition: background-color 220ms var(--ease), border-color 220ms;
  }
  .step.done .step-num { background: #2E8B57; border-color: #2E8B57; color: #fff; }
  .step.done .step-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .step-text { padding-top: 4px; transition: color 220ms; }
  .step-num .icon { width: 16px; height: 16px; stroke-width: 3; }
  .end-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }

  /* Bottom bar with the link to the original, like a booking bar */
  .bottom-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 6; background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line);
    padding: 12px 20px calc(var(--safe-bottom) + 12px);
  }
  .bottom-bar .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .bottom-bar .src { min-width: 0; }
  .bottom-bar .btn { flex: none; white-space: nowrap; }
  .bottom-bar .src b { display: block; font-weight: 800; }
  .bottom-bar .src span { display: block; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Forms */
  .head { margin-bottom: 22px; }
  .form { display: grid; gap: 18px; }
  .form label, .field-title { display: grid; gap: 8px; color: var(--text); font-size: 14px; font-weight: 700; margin: 0; }
  .form input, .form select, .form textarea {
    width: 100%; border: 1px solid var(--line-strong); background: #fff; border-radius: 10px; padding: 13px 14px; color: var(--text); font-weight: 500;
    transition: border-color 160ms, box-shadow 160ms;
  }
  .form input:focus, .form select:focus, .form textarea:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ingr-set { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
  .ingr-set legend { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .ing-row { display: grid; grid-template-columns: 1fr 72px 64px 36px; gap: 6px; }
  .btn-remove { border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; }
  .photo-box { display: grid; gap: 10px; }
  .photo-preview { width: 100%; max-height: 260px; object-fit: cover; border-radius: 14px; }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .emoji { border: 1px solid var(--line-strong); background: #fff; border-radius: 12px; font-size: 22px; aspect-ratio: 1; }
  .emoji.on { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  .actions { display: grid; gap: 10px; margin-top: 8px; }
  .error { color: var(--danger); margin: 10px 0 0; font-size: 15px; }

  /* Home greeting and shelves */
  .hello { margin: 0 0 2px; color: var(--muted); font-size: 15px; font-weight: 600; }
  .home-head h1 { font-size: 28px; max-width: 12em; }
  .shelf { margin-bottom: 28px; }
  .shelf-title { font-size: 20px; margin: 4px 0 12px; }
  .shelf-row {
    display: flex; gap: 14px; overflow-x: auto; margin: 0 -20px; padding: 4px 20px 14px; scroll-snap-type: x mandatory;
    scroll-padding-inline: 20px; scrollbar-width: none;
  }
  .shelf-row::-webkit-scrollbar { display: none; }
  .shelf-row .card { flex: 0 0 74%; max-width: 300px; scroll-snap-align: start; }
  .shelf-row .card-photo { aspect-ratio: 4 / 3; border-radius: 18px; }
  .shelf-row .card-title { font-size: 16px; }
  .card-photo { box-shadow: 0 14px 28px -16px rgba(40, 20, 0, 0.45); }
  .card-photo::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04); pointer-events: none; }
  .cats { border-bottom: 0; gap: 18px; padding-top: 6px; }
  .cat::after { display: none; }

  /* Recipe stats */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { display: grid; justify-items: start; gap: 2px; padding: 14px; border-radius: 18px; background: var(--surface); min-width: 0; }
  .stat-icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--c, #fff); margin-bottom: 8px; }
  .stat-icon .icon { width: 18px; height: 18px; }
  .stat b { font-size: 17px; font-weight: 800; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 13px; line-height: 1.3; }
  .ai-note { display: grid; grid-template-columns: 22px 1fr; gap: 12px; margin-top: 12px; padding: 14px; border-radius: 18px; background: #FFF4EC; }
  .ai-note .icon { color: #E8743B; }
  .ai-note b { display: block; font-weight: 700; }
  .ai-note span { display: block; color: var(--muted); font-size: 14px; }
  .ingr { background: var(--surface); border-radius: 18px; padding: 2px 16px; }

  @media (prefers-reduced-motion: reduce) {
    .app.enter > *, .fade, .heart.pop .icon, .round.pop .icon, .stagger .card, .app.vt .sheet, .bottom-bar, .step.just .step-num, .bump .serv-val, .bump .ingr b, .import-icon { animation: none !important; }
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
    .btn:active, .tool:active, .round:active, .heart:active, .fab:active, .step-btn:active, .card-open:active { transform: none; }
    .spinner { animation-duration: 3s; }
  }
</style>
</head>
<body>
<main class="app" id="app"></main>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  const BG = '#FFFFFF';
  if (tg) {
    tg.ready();

  // Saved choice first, then the Telegram language; unknown languages get English, no hint at all keeps Russian

  // Seed recipes are offered once: new ones reach existing users, deleted ones stay deleted
  function missingSeeds(list, offered) {
    const add = SEED.filter(s => !offered.includes(s.title) && !list.some(r => r.title === s.title));
    return { add, offered: SEED.map(s => s.title) };
  }

    const saved = readJSON(KEY, []);
    const list = Array.isArray(saved) ? saved : [];
    const { add, offered } = missingSeeds(list, readJSON(OFFERED_KEY, []));
    const next = [...list, ...add.map(r => ({ ...r, id: uid() }))];
    if (add.length) writeJSON(KEY, next);
    writeJSON(OFFERED_KEY, offered);
    return next;
  }

  }

  // Matches a category by stored name or by its label in any interface language
  function findCategory(name, cats) {
    const key = String(name || '').trim().toLowerCase();
    if (!key) return null;
    return cats.find(c => c.name !== OLD_BOT_CAT && (c.name.toLowerCase() === key ||
      Object.values(I18N).some(d => (d.cats[c.name] || '').toLowerCase() === key))) || null;
  }

  // Returns the category name to store, creating the category when the model proposed a new one
  function resolveCategory(name, icon) {
    const found = findCategory(name, allCategories());
    if (found) return found.name;
    const clean = String(name || '').trim().slice(0, 30);
    if (!clean) return CATEGORIES[2].name;
    const cat = { name: clean, icon: icon || '🍽️', color: PALETTE[customCats.length % PALETTE.length] };
    customCats = [...customCats, cat];
    writeJSON(CATS_KEY, customCats);
    return cat.name;
  }

  function fromServer(s) {

      time: Number(s.time) || 0,
      timeEstimated: !!s.timeEstimated,
      baseServings: Number(s.servings) || 4,
      ingredients: (s.ingredients || []).map(i => (typeof i === 'string'
        ? { name: i, amount: '', unit: '' }
        : { name: String(i.name || ''), amount: String(i.amount ?? ''), unit: String(i.unit ?? '') })),
      steps: (s.steps || []).map(String),
      source: safeUrl(s.source),

  function safeUrl(value) {

    return fetch(`${API}${path}`, {

      body: JSON.stringify(body)

  // Recipes saved before auto-categories sat in one "from the bot" category; sort them once
  async function migrateBotCategory() {
    for (const r of recipes.filter(x => x.category === OLD_BOT_CAT)) {
      const text = [r.title, ...r.ingredients.map(i => [i.name, i.amount, i.unit].filter(Boolean).join(' ')), ...r.steps].join('\n');
      try {
        const m = fromServer((await apiPost('/api/import', { input: text.slice(0, 8000), categories: userCategories() })).recipe);
        recipes = recipes.map(x => (x.id === r.id ? {
          ...x, category: m.category, time: x.time || m.time, timeEstimated: x.time ? !!x.timeEstimated : m.timeEstimated,
          baseServings: m.baseServings, ingredients: m.ingredients.length ? m.ingredients : x.ingredients, ai: true
        } : x));
        writeJSON(KEY, recipes);
      } catch (err) {
        console.error('migrate failed', err.message);
      }
    }
    if (!recipes.some(r => r.category === OLD_BOT_CAT) && customCats.some(c => c.name === OLD_BOT_CAT)) {
      customCats = customCats.filter(c => c.name !== OLD_BOT_CAT);
      writeJSON(CATS_KEY, customCats);
    }
    render();
  }

  function syncFromServer() {
    if (!tg || !tg.initData) return;
    fetch(`${API}/api/recipes`, { headers: { 'x-telegram-init-data': tg.initData } })

      .then(({ recipes: server }) => {
        const { add, imported } = newFromServer(server, readJSON(IMPORTED_KEY, []));
        if (add.length) {
          recipes = [...add.map(s => ({ ...fromServer(s), id: s.id })), ...recipes];
          if (!writeJSON(KEY, recipes)) return;
        }
        writeJSON(IMPORTED_KEY, imported);
        if (add.length) render();
      })
      .catch(err => console.error('sync failed', err.message))
      .finally(() => {
        if (recipes.some(r => r.category === OLD_BOT_CAT)) migrateBotCategory();
      });
  }

  // Scales the photo down and re-encodes it as JPEG so the data URL stays small
  function compressPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, MAX_PHOTO / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * k);
        canvas.height = Math.round(img.height * k);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error('bad image'));
      };
      img.src = url;
    });
  }

            ${r.photo ? `<img src="${esc(r.photo)}" alt="" loading="lazy">` : `<span class="no-photo" aria-hidden="true">${cat.icon}</span>`}
            ${r.source && VIDEO_LINK.test(r.source) ? `<span class="card-badge">${icon('play')}${t('video')}</span>` : ''}
          </span>
          <span class="card-title" dir="auto">${esc(r.title)}</span>
          <span class="card-meta">${esc(meta)}</span>
        </button>
        <button class="heart${r.favorite ? ' on' : ''}" data-action="toggle-fav" data-id="${esc(r.id)}" aria-pressed="${!!r.favorite}" aria-label="${r.favorite ? t('inFav') : t('toFav')}">${icon('heart')}</button>
      </article>`;
  }

  function grid(items, emptyText) {
    return items.length ? `<div class="grid">${items.map(card).join('')}</div>` : `<p class="empty">${emptyText}</p>`;
  }

  function resultsHtml() {
    const q = state.query.trim().toLowerCase();
    let found = recipes;
    if (state.category === FAV) found = found.filter(r => r.favorite);
    else if (state.category) found = found.filter(r => r.category === state.category);
    if (q) found = found.filter(r => r.title.toLowerCase().includes(q) || r.ingredients.some(i => i.name.toLowerCase().includes(q)));
    const empty = q ? t('nothing') : state.category === FAV ? t('favsEmpty') : state.category ? t('catEmpty') : t('noRecipes');
    if (q || state.category || recipes.length < 5) return grid(found, empty);
    const quick = recipes.filter(r => r.time && r.time <= 30);
    return `
      ${shelf(t('recent'), recipes.slice(0, 8))}
      ${quick.length >= 2 ? shelf(t('quick'), quick.slice(0, 8)) : ''}
      <h2 class="shelf-title">${t('allRecipes')}</h2>
      ${grid(found, empty)}`;
  }

  // A horizontal row of big cards; the photos are not shared elements, the grid below has the same recipes
  function shelf(title, items) {
    return `
      <section class="shelf">
        <h2 class="shelf-title">${title}</h2>
        <div class="shelf-row">${items.map((r, i) => card(r, i, false)).join('')}</div>

  function renderRecipe() {

    const translatePanel = !tr && state.showTranslate ? `
      <div class="translate">
        <input id="t-lang" list="t-langs" value="${esc(readJSON(LANG_KEY, 'English'))}" placeholder="${t('langPh')}" aria-label="${t('langAria')}">
        <datalist id="t-langs">${LANGS.map(l => `<option value="${esc(l)}">`).join('')}</datalist>
        <button class="btn btn-dark" data-action="translate"${state.translating ? ' disabled' : ''}>${state.translating ? t('translating') : t('translate')}</button>

    return `
      <div class="hero" style="view-transition-name:${vtName(r.id)}">

        <div class="hero-bar">

          <span class="spacer"></span>
          <button class="round${r.favorite ? ' on' : ''}" data-action="toggle-fav" data-id="${esc(r.id)}" aria-pressed="${!!r.favorite}" aria-label="${r.favorite ? t('inFav') : t('toFav')}">${icon('heart')}</button>

        <hr class="divider">
        <div class="stats" style="--c:${cat.color}">

          <div class="stat"><span class="stat-icon">${icon('check')}</span><b>${r.ingredients.length}</b><span>${t('ingrCount')}</span></div>
        </div>

        <hr class="divider">
        <div class="tools">
          <button class="tool${tr || state.showTranslate ? ' on' : ''}" data-action="${tr ? 'show-original' : 'toggle-translate'}">${icon('globe')}${tr ? t('showOriginal') : t('translate')}</button>
          <button class="tool" data-action="edit">${icon('edit')}${t('edit')}</button>
        </div>
        ${translatePanel}
        ${tr ? `<p class="sub">${esc(t('translated')(tr.lang))}</p>` : ''}
        ${state.translateError ? `<p class="error">${esc(state.translateError)}</p>` : ''}

        <hr class="divider">
        <section>
          <div class="section-head">
            <h2>${t('ingredients')}</h2>
            <div class="servings">
              <button class="step-btn" data-action="serv-dec" aria-label="${t('servLess')}"${state.servings <= 1 ? ' disabled' : ''}>${icon('minus')}</button>
              <span class="serv-val">${state.servings} ${portions(state.servings)}</span>
              <button class="step-btn" data-action="serv-inc" aria-label="${t('servMore')}">${icon('plus')}</button>
            </div>
          </div>
          <ul class="ingr">
            ${shown.ingredients.map(i => `
              <li>
                <span dir="auto">${esc(i.name)}</span>
                ${i.amount || i.unit ? `<b>${esc(scale(i.amount, factor))} ${esc(i.unit)}</b>` : ''}
              </li>`).join('')}
          </ul>
        </section>

        <hr class="divider">
        <section>
          <h2>${t('cooking')}</h2>
          <ol class="steps">
            ${shown.steps.map((s, i) => {
              const isDone = doneList.includes(i);
              return `
              <li class="step${isDone ? ' done' : ''}" data-action="toggle-step" data-index="${i}" role="button" tabindex="0" aria-pressed="${isDone}">
                <span class="step-num">${isDone ? icon('check') : i + 1}</span>

        <hr class="divider">
        <div class="end-actions">
          ${doneList.length ? `<button class="btn btn-ghost" data-action="reset-done">${t('resetDone')}</button>` : '<span></span>'}
          <button class="btn btn-danger" data-action="delete">${icon('trash')}${state.confirmDelete ? t('confirmDelete') : t('deleteRecipe')}</button>
        </div>
      </div>
      ${r.source ? `
      <div class="bottom-bar">
        <div class="in">
          <div class="src"><b>${t('sourceTitle')}</b><span>${esc(hostOf(r.source))}</span></div>
          <button class="btn btn-primary" data-action="open-source">${icon(isVideo ? 'play' : 'link')}${isVideo ? t('openVideo') : t('openPage')}</button>
        </div>

  function renderForm() {
    const d = state.draft;
    const options = allCategories().map(c =>
      `<option value="${esc(c.name)}"${c.name === d.category ? ' selected' : ''}>${c.icon} ${esc(catLabel(c.name))}</option>`
    ).join('');
    const rows = d.ingredients.map((i, idx) => `
      <div class="ing-row">
        <input data-f="name" placeholder="${t('product')}" value="${esc(i.name)}" aria-label="${t('ingName')}">
        <input data-f="amount" placeholder="${t('amountPh')}" inputmode="decimal" value="${esc(i.amount)}" aria-label="${t('amount')}">
        <input data-f="unit" placeholder="${t('unitPh')}" value="${esc(i.unit)}" aria-label="${t('unit')}">
        <button class="btn-remove" data-action="remove-row" data-index="${idx}" aria-label="${t('removeRow')}">${icon('close')}</button>
      </div>`).join('');
    return `
      <header class="head">
        <h1>${state.editingId ? t('editing') : t('newRecipe')}</h1>
      </header>
      ${state.error ? `<p class="error">${esc(state.error)}</p>` : ''}
      <div class="form">
        <label>${t('name')}
          <input id="f-name" placeholder="${t('recipeNamePh')}" value="${esc(d.name)}">
        </label>
        <div class="photo-box">
          <p class="field-title">${t('photo')}</p>
          ${d.photo ? `<img class="photo-preview" src="${esc(d.photo)}" alt="${t('photoAlt')}">` : `<p class="sub">${t('noPhoto')}</p>`}
          <button class="btn btn-soft" data-action="pick-photo">${d.photo ? t('replacePhoto') : t('addPhoto')}</button>
          ${d.photo ? `<button class="btn btn-ghost" data-action="remove-photo">${t('removePhoto')}</button>` : ''}
          <input id="f-photo" type="file" accept="image/*" hidden>
        </div>
        <label>${t('sourceLabel')}
          <input id="f-source" type="url" inputmode="url" placeholder="https://" value="${esc(d.source || '')}" dir="ltr">
        </label>
        <label>${t('category')}
          <select id="f-cat">${options}</select>
        </label>
        <div class="row2">
          <label>${t('timeMin')}
            <input id="f-time" type="number" inputmode="numeric" min="0" value="${esc(d.time)}">
          </label>
          <label>${t('servingsLabel')}
            <input id="f-serv" type="number" inputmode="numeric" min="1" value="${esc(d.servings)}">
          </label>
        </div>
        <fieldset class="ingr-set">
          <legend>${t('ingredients')}</legend>
          <div id="ing-list">${rows}</div>
          <button class="btn btn-soft" data-action="add-row">${t('addIngredient')}</button>
        </fieldset>
        <label>${t('cooking')}
          <textarea id="f-steps" rows="8" placeholder="${t('stepsPh')}">${esc(d.steps)}</textarea>
        </label>
        <div class="actions">
          <button class="btn btn-dark" data-action="save">${t('save')}</button>
          <button class="btn btn-ghost" data-action="cancel">${t('cancel')}</button>
        </div>
      </div>`;
  }

  function render() {
    const views = { home: renderHome, recipe: renderRecipe, form: renderForm, 'cat-form': renderCatForm };
    const body = views[state.view]();
    const hero = state.view === 'recipe';
    const back = state.view === 'home' || hero || !OWN_BACK ? '' : `<div class="top"><button class="round" data-action="back" aria-label="${t('back')}">${icon('back', 'flip')}</button></div>`;
    const entering = state.view !== lastView || (hero && state.recipeId !== lastRecipe);
    app.classList.toggle('hero-view', hero);
    app.classList.remove('enter', 'vt');
    app.innerHTML = back + body;

    if (entering) {
      window.scrollTo(0, state.restoreScroll || 0);
      void app.offsetWidth; // restart the entrance animation
      app.classList.add(viaTransition ? 'vt' : 'enter');
      const results = document.getElementById('results');
      if (results && !state.restoreScroll) results.classList.add('stagger');
      lastView = state.view;
      lastRecipe = state.recipeId;
    }
    parallax();
    if (tg && tg.BackButton) {
      if (state.view === 'home') tg.BackButton.hide();
      else tg.BackButton.show();
    }
  }

  function fail(message) {
    state.error = message;
    render();
  }

  // Turns raw form values into a recipe, or { error } with the first problem found
  function parseRecipe(d) {
    const title = d.name.trim();
    const time = d.time.trim();
    const servings = d.servings.trim();
    const ingredients = d.ingredients
      .map(i => ({ name: i.name.trim(), amount: i.amount.trim().replace(',', '.'), unit: i.unit.trim() }))
      .filter(i => i.name);
    const steps = d.steps.split('\n').map(s => s.trim()).filter(Boolean);
    const source = String(d.source || '').trim();

    if (!title) return { error: t('errTitle') };
    if (title.length > 80) return { error: t('errTitleLong') };
    if (!allCategories().some(c => c.name === d.category)) return { error: t('errCat') };
    if (time && !/^\d+$/.test(time)) return { error: t('errTime') };
    if (!/^\d+$/.test(servings) || Number(servings) < 1) return { error: t('errServ') };
    if (!ingredients.length) return { error: t('errIngr') };
    if (!steps.length) return { error: t('errSteps') };
    if (source && !safeUrl(source)) return { error: t('errSource') };

    return {
      recipe: {
        title,
        category: d.category,
        time: Number(time) || 0,
        baseServings: Number(servings),
        ingredients,
        steps,
        source,
        photo: d.photo
      }
    };
  }

  function parseCategory(c, existing) {
    const name = c.name.trim();
    if (!name) return { error: t('errCatName') };
    if (name.length > 30) return { error: t('errCatLong') };
    if (existing.some(x => x.name.toLowerCase() === name.toLowerCase())) return { error: t('errCatExists') };
    if (!c.icon) return { error: t('errEmoji') };
    return { category: { name, icon: c.icon, color: PALETTE[(existing.length - CATEGORIES.length) % PALETTE.length] } };
  }

  function readCatForm() {
    state.catDraft.name = document.getElementById('c-name').value;
    return state.catDraft;
  }

  function saveRecipe() {
    const parsed = parseRecipe(readForm());
    if (parsed.error) return fail(parsed.error);
    const old = recipes.find(r => r.id === state.editingId) || {};
    const recipe = {
      ...parsed.recipe,
      id: state.editingId || uid(),
      favorite: !!old.favorite,
      ai: !!old.ai,
      timeEstimated: !!old.timeEstimated && parsed.recipe.time === old.time
    };

    const next = state.editingId
      ? recipes.map(r => (r.id === recipe.id ? recipe : r))
      : [recipe, ...recipes];
    if (!writeJSON(KEY, next)) {
      return fail(t('errStorage'));
    }
    recipes = next;

    if (state.editingId) {
      delete done[recipe.id];
      writeJSON(DONE_KEY, done);
      state.history = state.history.slice(0, -1); // drop the recipe screen the edit came from
    }

    go('recipe', { recipeId: recipe.id, servings: recipe.baseServings }, { replace: true });
  }

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;

    switch (el.dataset.action) {
      case 'back':
        goBack();
        break;

      case 'filter': {
        state.category = el.dataset.cat;
        render();
        const results = document.getElementById('results');
        if (results && results.classList) results.classList.add('stagger');
        const tab = document.querySelector('.cat.on');
        if (tab) tab.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
        haptic('tap');
        break;
      }

      case 'open-source': {
        const r = recipes.find(x => x.id === state.recipeId);
        const url = r && safeUrl(r.source);
        if (!url) break;
        if (tg && /^https:\/\/t\.me\//i.test(url)) tg.openTelegramLink(url);
        else if (tg) tg.openLink(url);
        else window.open(url, '_blank', 'noopener');
        break;
      }

      case 'open-recipe': {
        const r = recipes.find(x => x.id === el.dataset.id);
        if (r) go('recipe', { recipeId: r.id, servings: r.baseServings, showTranslate: false });
        break;
      }

      case 'new': {
        go('form', {
          draft: blankDraft(state.category && state.category !== FAV ? state.category : ''),
          editingId: ''
        });
        break;
      }

      case 'open-bot': {
        const url = `https://t.me/${BOT_USERNAME}`;
        if (tg) tg.openTelegramLink(url);
        else window.open(url, '_blank');
        break;
      }

      case 'translate': {
        const r = recipes.find(x => x.id === state.recipeId);
        const lang = document.getElementById('t-lang').value.trim();
        if (!r || state.translating) break;
        if (!lang) {
          state.translateError = t('errLang');
          render();
          break;
        }
        if (!tg || !tg.initData) {
          state.translateError = t('errOnlyTg');
          render();
          break;
        }
        writeJSON(LANG_KEY, lang);
        Object.assign(state, { translating: true, translateError: '' });
        render();
        const recipe = {
          title: String(r.title),
          ingredients: r.ingredients.map(i => ({ name: String(i.name ?? ''), amount: String(i.amount ?? ''), unit: String(i.unit ?? '') })),
          steps: r.steps.map(String)
        };
        fetch(`${API}/api/translate`, {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-telegram-init-data': tg.initData },
          body: JSON.stringify({ recipe, lang })
        })
          .then(res => (res.ok ? res.json() : Promise.reject(new Error(res.status))))
          .then(data => { state.translation = { id: r.id, lang, recipe: data.recipe }; })
          .catch(() => { state.translateError = t('errTranslate'); })
          .finally(() => {
            state.translating = false;
            render();
          });
        break;
      }

      case 'import': {
        const input = document.getElementById('import-text').value.trim();
        state.importText = input;
        if (state.importing) break;
        if (!input) {
          state.importError = t('importEmpty');
          render();
          break;
        }
        if (!tg || !tg.initData) {
          state.importError = t('importOnlyTg');
          render();
          break;
        }
        Object.assign(state, { importing: VIDEO_LINK.test(input) ? t('importingVideo') : t('importing'), importError: '' });
        render();
        apiPost('/api/import', { input, categories: userCategories() })
          .then(({ recipe: server }) => {
            const recipe = { ...fromServer(server), id: uid() };
            const next = [recipe, ...recipes];
            if (!writeJSON(KEY, next)) throw new Error('storage');
            recipes = next;
            state.importText = '';
            state.importing = '';
            haptic('success');
            go('recipe', { recipeId: recipe.id, servings: recipe.baseServings });
          })
          .catch(err => {
            state.importing = '';
            state.importError = err.message === 'youtube' ? t('importYoutube') : err.message === 'storage' ? t('errStorage') : t('importFailed');
            haptic('error');
            render();
          });
        break;
      }

      case 'toggle-translate':
        state.showTranslate = !state.showTranslate;
        state.translateError = '';
        render();
        break;

      case 'ui-lang':
        uiLang = el.dataset.lang;
        writeJSON(UI_LANG_KEY, uiLang);
        applyDir();
        render();
        break;

      case 'show-original':
        state.translation = null;
        render();
        break;

      case 'toggle-fav': {
        const id = el.dataset.id || state.recipeId;
        const next = recipes.map(x => (x.id === id ? { ...x, favorite: !x.favorite } : x));
        if (writeJSON(KEY, next)) recipes = next;
        haptic('tap');
        render();
        const again = document.querySelector(`[data-action="toggle-fav"][data-id="${CSS.escape(id)}"]`);
        if (again && again.classList.contains('on')) again.classList.add('pop');
        break;
      }

      case 'edit': {
        const r = recipes.find(x => x.id === state.recipeId);
        if (r) go('form', { draft: draftOf(r), editingId: r.id });
        break;
      }

      case 'cancel':
        goBack();
        break;

      case 'save':
        saveRecipe();
        break;

      case 'serv-inc':
      case 'serv-dec': {
        state.servings = Math.min(50, Math.max(1, state.servings + (el.dataset.action === 'serv-inc' ? 1 : -1)));
        haptic('tap');
        render();
        const section = document.querySelector('.servings');
        if (section) section.closest('section').classList.add('bump');
        break;
      }

      case 'toggle-step': {
        const idx = Number(el.dataset.index);
        const list = done[state.recipeId] || [];
        done[state.recipeId] = list.includes(idx) ? list.filter(i => i !== idx) : [...list, idx];
        haptic('tap');
        writeJSON(DONE_KEY, done);
        render();
        const stepEl = document.querySelector(`.step[data-index="${idx}"]`);
        if (stepEl) stepEl.classList.add('just');
        break;
      }

      case 'reset-done':
        delete done[state.recipeId];
        writeJSON(DONE_KEY, done);
        render();
        break;

      case 'delete': {
        if (!state.confirmDelete) {
          state.confirmDelete = true;
          render();
          break;
        }
        recipes = recipes.filter(r => r.id !== state.recipeId);
        delete done[state.recipeId];
        writeJSON(KEY, recipes);
        writeJSON(DONE_KEY, done);
        state.query = '';
        goBack();
        break;
      }

      case 'new-cat':
        go('cat-form', { catDraft: { name: '', icon: CAT_ICONS[0] } });
        break;

      case 'pick-icon':
        readCatForm();
        state.catDraft.icon = el.dataset.icon;
        render();
        break;

      case 'save-cat': {
        const res = parseCategory(readCatForm(), allCategories());
        if (res.error) return fail(res.error);
        const next = [...customCats, res.category];
        if (!writeJSON(CATS_KEY, next)) return fail(t('errCatStorage'));
        customCats = next;
        goBack();
        break;
      }

      case 'pick-photo':
        document.getElementById('f-photo').click();
        break;

      case 'remove-photo':
        readForm();
        state.draft.photo = '';
        render();
        break;

      case 'add-row': {
        const d = readForm();
        d.ingredients.push({ name: '', amount: '', unit: '' });
        render();
        break;
      }

      case 'remove-row': {
        const d = readForm();
        const idx = Number(el.dataset.index);
        if (d.ingredients.length > 1) d.ingredients.splice(idx, 1);
        else d.ingredients = [{ name: '', amount: '', unit: '' }];
        render();
        break;
      }
    }
  });

  app.addEventListener('input', e => {
    if (e.target.id === 'import-text') state.importText = e.target.value;
    if (e.target.id !== 'search') return;
    state.query = e.target.value;
    document.getElementById('results').innerHTML = resultsHtml();
  });

  app.addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (e.target.id !== 'f-photo' || !file || state.view !== 'form') return;
    readForm();
    compressPhoto(file)
      .then(photo => {
        state.draft.photo = photo;
        state.error = '';
        render();
      })
      .catch(() => fail(t('errPhotoFile')));
  });

  app.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('step')) {
      e.preventDefault();
      e.target.click();
    }
  });

  // The recipe photo drifts slower than the page and stretches when pulled down
  function parallax() {
    if (reduceMotion || state.view !== 'recipe') return;
    const media = document.querySelector('.hero img, .hero .no-photo');
    if (!media) return;
    const y = window.scrollY;
    media.style.transform = y < 0 ? `scale(${1 - y / 260})` : `translateY(${y * 0.4}px) scale(${1 + y / 4000})`;
  }
  window.addEventListener('scroll', () => requestAnimationFrame(parallax), { passive: true });

  if (tg && tg.BackButton) tg.BackButton.onClick(goBack);

  recipes = loadRecipes();
  customCats = readJSON(CATS_KEY, []);
  done = readJSON(DONE_KEY, {});
  applyDir();
  render();
  syncFromServer();
</script>
</body>
</html>
